# Full local stack: PostgreSQL (pgvector), backend (FastAPI), frontend (Next.js). The LLM and
# embeddings come from a NATIVE Ollama (WSL2: `ollama serve`, GPU) by default; the containerised
# Ollama is only in the `ci` profile (T11.0.11/T11.0.12, ADR phase 11).
#
#   ollama serve                                   # native, bound to 127.0.0.1:11434 (WSL)
#   ollama pull bge-m3 && ollama pull qwen2.5:7b-instruct-q4_K_M
#   scripts/dev/create_dev_volume.sh               # once: the external dev volume
#   docker compose up -d --build                   # db → db-roles → migrate → backend → frontend
#                                                  # (+ purger: hourly erasure loop, T11.2b.6)
#
#   docker compose --profile ci up -d ...          # containerised Ollama instead; then set
#                                                  # CONTAINER_OLLAMA_HOST=http://ollama:11434
#
# How the backend container reaches the native Ollama without exposing it: the container calls
# host.docker.internal:11434 (Docker Desktop → Windows loopback); WSL2's localhost forwarding
# relays Windows 127.0.0.1:11434 to Ollama's 127.0.0.1:11434 inside WSL. Ollama stays on
# loopback (no LAN exposure, no firewall rule, no .wslconfig change).
#
# Every published port is bound to 127.0.0.1 only. Compose reads its variables from the shell
# or from an OPTIONAL repository-root .env (git-ignored; not created by the setup steps, and
# not the same file as backend/.env, which compose does not read; keys: .env.example).
# JWT_SECRET and DATA_MASTER_KEY must be set. ENV defaults to prod (fail-closed): with no
# ENV in the shell or a root .env, dev-only features stay off — export ENV=dev (or add it
# to a root .env) for local development.
services:
  db:
    image: pgvector/pgvector:pg16
    # terse: the server log leaves out DETAIL lines, e.g. a unique violation's
    # "Key (email)=(…) already exists" (DA-G2-1). The same setting on Azure (runbook row 40).
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: database roles before any migration (db/roles.sql, T11.0.13). Idempotent.
  # A role gets LOGIN only when its password is set (shell or optional root .env).
  db-roles:
    image: pgvector/pgvector:pg16
    entrypoint: ["bash", "/secrag/scripts/db/apply_roles.sh"]
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      SECRAG_PURGER_PASSWORD: ${SECRAG_PURGER_PASSWORD:-}
      SECRAG_BACKUP_PASSWORD: ${SECRAG_BACKUP_PASSWORD:-}
    volumes:
      - ./db:/secrag/db:ro
      - ./scripts/db:/secrag/scripts/db:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot: migrations, once per `up`, after the roles and before the backend (T11.2.5).
  # Runs from the slim jobs image, like the Azure migration Job; the backend image never
  # migrates. Needs only DATABASE_URL (JobSettings) — no JWT_SECRET / DATA_MASTER_KEY.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.jobs
      additional_contexts:
        dbscripts: ./scripts/db
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      ENV: ${ENV:-prod}
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  # The erasure purger (T11.2b.6): the local runner of the Azure hourly purge Job — same slim
  # jobs image, same least-privilege role `secrag_purger` (LOGIN only when
  # SECRAG_PURGER_PASSWORD is set in the shell or root .env, then db-roles gives it; URL-safe
  # characters only). One run every PURGE_INTERVAL_SECONDS (default 3600): pending erasures
  # complete without manual action, and each run writes the tombstone export to the
  # git-ignored ./.tombstones (restore.sh --tombstones-dir .tombstones), pruned after 30 days.
  # Runs as your WSL user (SECRAG_UID/SECRAG_GID, default 1000) so the export files are yours.
  purger:
    build:
      context: ./backend
      dockerfile: Dockerfile.jobs
      additional_contexts:
        dbscripts: ./scripts/db
    command:
      - python
      - -m
      - rag_app.erasure
      - loop
      - --interval
      - "${PURGE_INTERVAL_SECONDS:-3600}"
      - --export-dir
      - /tombstones
    user: "${SECRAG_UID:-1000}:${SECRAG_GID:-1000}"
    environment:
      DATABASE_URL: postgresql+psycopg://secrag_purger:${SECRAG_PURGER_PASSWORD:-}@db:5432/rag
      ENV: ${ENV:-prod}
    volumes:
      - ./.tombstones:/tombstones
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ci"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    # GPU passthrough (NVIDIA). Requires nvidia-container-toolkit on the host, so this
    # service does not start on a GPU-less host (e.g. a GitHub runner) as is.
    # Comment this block out if running CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      # Native Ollama through host.docker.internal (see the header); override with CONTAINER_OLLAMA_HOST.
      OLLAMA_HOST: ${CONTAINER_OLLAMA_HOST:-http://host.docker.internal:11434}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATA_MASTER_KEY: ${DATA_MASTER_KEY:?set DATA_MASTER_KEY}
      ENV: ${ENV:-prod}
      # Global daily answer cap (R6-1): high locally; must stay positive with ENV=prod.
      DAILY_ANSWER_CAP: ${DAILY_ANSWER_CAP:-1000}
      FRONTEND_ORIGIN: http://localhost:3000
      # Per-stage latency histograms + the in-flight gauge (T11.3.2, TF4): a SEPARATE
      # internal port, never published to the host and never the API port. Only the
      # `prometheus` service (same compose network) reads it.
      METRICS_PORT: ${METRICS_PORT:-9100}
    # Built in on Docker Desktop; needed on a plain Linux engine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "${METRICS_PORT:-9100}"
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
        required: false

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  # Scrapes the backend's internal metrics port only (T11.3.3); 7-day retention (disk is
  # throwaway monitoring data, not the protected dev DB volume); image pinned by digest
  # (X1) so a re-tagged upstream image can never silently change what runs. UI/API on
  # 127.0.0.1 only — never on the LAN or the internet.
  prometheus:
    image: prom/prometheus@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

volumes:
  # The development database lives in ONE fixed, external volume (T11.2.1). Before, `pgdata`
  # had no name, so Docker prefixed it with the compose project (the checkout folder) and a
  # checkout under another folder silently started on an empty database (ADR phase 11,
  # Diagnosis). `external: true`: compose never creates, recreates or removes it (`down -v`
  # included) — create it once with scripts/dev/create_dev_volume.sh; `up` fails clearly if
  # it is missing. The gate never references it (compose.gate.yml, restart_check.sh).
  pgdata:
    name: rag_ia_pgdata
    external: true
  ollama:
  # Prometheus's own TSDB (7-day retention, T11.3.3): throwaway monitoring data, not the
  # protected dev DB volume above — fine to recreate/remove with the rest of the stack.
  prometheus_data:
