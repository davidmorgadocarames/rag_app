# Full local stack: PostgreSQL (pgvector), Ollama, backend (FastAPI), frontend (Next.js).
#
#   docker compose up -d db ollama         # infra only
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct-q4_K_M
#   docker compose exec ollama ollama pull bge-m3
#   JWT_SECRET=... DATA_MASTER_KEY=... docker compose up -d --build   # whole app
#
# JWT_SECRET and DATA_MASTER_KEY must be provided (env or a root .env; see .env.example).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # GPU passthrough (NVIDIA). Requires nvidia-container-toolkit on the host.
    # Comment this block out if running CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      OLLAMA_HOST: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATA_MASTER_KEY: ${DATA_MASTER_KEY:?set DATA_MASTER_KEY}
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama:
