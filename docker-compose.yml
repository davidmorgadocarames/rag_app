# Full local stack: PostgreSQL (pgvector), backend (FastAPI), frontend (Next.js). The LLM and
# embeddings come from a NATIVE Ollama (WSL2: `ollama serve`, GPU) by default; the containerised
# Ollama is only in the `ci` profile (T11.0.11/T11.0.12, ADR phase 11).
#
#   ollama serve                                   # native, bound to 127.0.0.1:11434 (WSL)
#   ollama pull bge-m3 && ollama pull qwen2.5:7b-instruct-q4_K_M
#   docker compose up -d --build                   # db → db-roles → backend → frontend
#
#   docker compose --profile ci up -d ...          # containerised Ollama instead; then set
#                                                  # CONTAINER_OLLAMA_HOST=http://ollama:11434
#
# How the backend container reaches the native Ollama without exposing it: the container calls
# host.docker.internal:11434 (Docker Desktop → Windows loopback); WSL2's localhost forwarding
# relays Windows 127.0.0.1:11434 to Ollama's 127.0.0.1:11434 inside WSL. Ollama stays on
# loopback (no LAN exposure, no firewall rule, no .wslconfig change).
#
# Every published port is bound to 127.0.0.1 only. Compose reads its variables from the shell
# or from an OPTIONAL repository-root .env (git-ignored; not created by the setup steps, and
# not the same file as backend/.env, which compose does not read; keys: .env.example).
# JWT_SECRET and DATA_MASTER_KEY must be set. ENV defaults to prod (fail-closed): with no
# ENV in the shell or a root .env, dev-only features stay off — export ENV=dev (or add it
# to a root .env) for local development.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: database roles before any migration (db/roles.sql, T11.0.13). Idempotent.
  # A role gets LOGIN only when its password is set (shell or optional root .env).
  db-roles:
    image: pgvector/pgvector:pg16
    entrypoint: ["bash", "/secrag/scripts/db/apply_roles.sh"]
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      SECRAG_PURGER_PASSWORD: ${SECRAG_PURGER_PASSWORD:-}
      SECRAG_BACKUP_PASSWORD: ${SECRAG_BACKUP_PASSWORD:-}
    volumes:
      - ./db:/secrag/db:ro
      - ./scripts/db:/secrag/scripts/db:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ci"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    # GPU passthrough (NVIDIA). Requires nvidia-container-toolkit on the host, so this
    # service does not start on a GPU-less host (e.g. a GitHub runner) as is.
    # Comment this block out if running CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      # Native Ollama through host.docker.internal (see the header); override with CONTAINER_OLLAMA_HOST.
      OLLAMA_HOST: ${CONTAINER_OLLAMA_HOST:-http://host.docker.internal:11434}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATA_MASTER_KEY: ${DATA_MASTER_KEY:?set DATA_MASTER_KEY}
      ENV: ${ENV:-prod}
      FRONTEND_ORIGIN: http://localhost:3000
    # Built in on Docker Desktop; needed on a plain Linux engine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
      ollama:
        condition: service_started
        required: false

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama:
