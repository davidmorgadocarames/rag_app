name: CD

# Deploys `main` to Azure Container Apps after CI has succeeded on it (T11.0.9, PHASE_PLANNING
# §1 rule 2). The cloud path uses a hosted LLM (Azure OpenAI via LLM_PROVIDER); see
# docs/adr/adr_phase10_azure.md and docs/adr/adr_phase11_stability.md.
#
#   plan         skip a SHA that is no longer the branch tip at plan time or that is not newer
#                than the LAST DEPLOYED SHA (equal to it or an ancestor: CD never rolls back,
#                DA-C-1); then changed files vs that SHA (GitHub Deployments): only docs/**,
#                **/*.md or deploy/k8s/** changed → build and deploy are skipped; otherwise
#                maps the changed files to the 4 images that need a new build (T13.CD.1,
#                scripts/cd/plan.sh): backend/** → backend+jobs, frontend/** → frontend,
#                ollama/** → ollama, this pipeline's own files or force_all → all four,
#                anything else unmapped → all four (fail-safe). A real manual deploy also
#                needs a successful CI push run for the SHA on main (DA-C-2, D-2026-09-29-1 a);
#                dry runs only report that check.
#   gate-status  the SHA must carry the commit status `secrag/gate-full` = success, posted by
#                `scripts/gate.sh --full` for exactly that SHA (D-2026-09-27-7 b); otherwise
#                the deploy is REFUSED (a skipped pre-push hook can no longer reach Azure)
#   images       build + push ONLY the images the plan flagged (backend, frontend, ollama —
#                T11.4.3 — and/or the slim jobs image), tagged with the SHA; deployed BY DIGEST
#   migrate      re-checks the gate status; resolves the jobs image — the one just built, or
#                (T13.CD.2) the one currently deployed on the migration Job, fail-closed if
#                unreadable or not digest-pinned — and starts the migration Job with it, no
#                overrides; CD waits and STOPS on a failure, before the apps
#                (scripts/cd/azure_jobs.sh, T11.2.6). Always runs on every real deploy, even
#                when the jobs image itself did not change: simpler and safer than a
#                conditional migration step, and migrations must still run whenever
#                backend/** changed — which always flags the jobs image too (T13.CD.1)
#   deploy       re-checks the gate status, records a deployment, resolves each app's image
#                the same way (built just now, or kept from Azure, fail-closed) and updates
#                ONLY the apps the plan flagged — `secrag-ollama` BEFORE `secrag-backend`/
#                `secrag-frontend` when ollama changed too (the backend calls Ollama
#                synchronously for embeddings on every chat/ingestion request; Ollama must
#                already be serving the baked-in model before backend's new revision can take
#                traffic, same "dependency before dependent" order as the migration Job before
#                the apps) — then the purge and backup Jobs' images: updated to the new digest
#                if the jobs image itself changed (digest, X1; T11.2.11), otherwise cross-
#                checked, read-only and fail-closed, against the migration Job's resolved
#                image (DA-13-0-1) — an out-of-band fix to only one of the three Jobs during
#                an incident would otherwise desync them without CD ever noticing
#
# Order: images → migrate Job (always) → ollama app → backend/frontend apps → Job images —
# only the apps/Jobs whose image actually changed are touched (T13.CD.2, "CD per-image
# build"). Job names come from repo variables (AZURE_MIGRATE_JOB, AZURE_PURGE_JOB,
# AZURE_BACKUP_JOB); the Jobs themselves are created by hand from deploy/azure/jobs/*.yaml
# (runbook) — CD never applies YAML or enables schedules.
#
# One SHA everywhere: head_sha of the CI run (workflow_run) or the dispatched commit.
# Manual runs (workflow_dispatch) default to dry_run=true: plan + gate-status run (read-only)
# and an echo job prints what a real run would do. A real manual deploy needs dry_run=false
# AND the main branch. base_sha/head_sha/skip_tip_check exist to test the plan in dry runs only,
# simulate_failure to show the migrate-failure path in a dry run. force_all (T13.CD.1) forces
# all 4 images to build, in BOTH dry runs and real runs — it never turns a skipped SHA (not
# the tip, an ancestor, docs-only, nothing changed) into a deploy.
# No job uses `environment:`, so the OIDC subject stays repo:<owner>/<repo>:ref:refs/heads/main
# (runbook, gotcha 8). CD never enables Job schedules and never applies Job YAML (X1).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only plan and echo what would be built and deployed"
        type: boolean
        default: true
      base_sha:
        description: "Dry runs only: compare with this SHA instead of the last deployed one"
        type: string
        default: ""
      head_sha:
        description: "Dry runs only: plan this SHA instead of the dispatched ref's head"
        type: string
        default: ""
      skip_tip_check:
        description: "Dry runs only: plan head_sha even if it is not the ref's tip"
        type: boolean
        default: false
      simulate_failure:
        description: "Dry runs only: the migration Job 'fails', to show the pipeline stops there"
        type: boolean
        default: false
      force_all:
        description: "Dry runs AND real runs: build all 4 images regardless of changed files"
        type: boolean
        default: false

# Real deploys are serialised in one group and never cancelled mid-flight; dry runs and
# echo runs get their own group so they can never replace a pending real deploy.
concurrency:
  group: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run == false)) && 'cd-main' || format('cd-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (changed files vs last deployed SHA)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: read       # ci_status.sh: CI runs of the SHA
      contents: read
      deployments: read
    outputs:
      real: ${{ steps.mode.outputs.real }}
      sha: ${{ steps.plan.outputs.sha }}
      deploy: ${{ steps.plan.outputs.deploy }}
      reason: ${{ steps.plan.outputs.reason }}
      build_backend: ${{ steps.plan.outputs.build_backend }}
      build_frontend: ${{ steps.plan.outputs.build_frontend }}
      build_jobs: ${{ steps.plan.outputs.build_jobs }}
      build_ollama: ${{ steps.plan.outputs.build_ollama }}
    steps:
      - name: Mode and SHA
        id: mode
        env:
          REAL: ${{ github.event_name == 'workflow_run' || (github.ref == 'refs/heads/main' && inputs.dry_run == false) }}
          SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SKIP_TIP_CHECK: ${{ inputs.skip_tip_check }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          # DA-C2-3: every expression reaches the shell through env, never pasted into
          # `run:` (a ref name may contain `$(`, `;` or backticks).
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "event=$EVENT ref=$REF dry_run=$DRY_RUN real=$REAL sha=$SHA"
          if [ "$EVENT" = workflow_run ]; then
            echo "CI succeeded for $CI_BRANCH@$CI_SHA"
          fi
          if [ "$REAL" = true ] && { [ -n "$BASE_SHA$HEAD_SHA" ] || [ "$SKIP_TIP_CHECK" = true ] || [ "$SIMULATE_FAILURE" = true ]; }; then
            echo "::error::base_sha/head_sha/skip_tip_check/simulate_failure are for dry runs only; a real deploy uses the dispatched commit"
            exit 1
          fi
          echo "real=$REAL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The workflow's own revision (for scripts/cd) with full history: the SHAs to compare
      # are read from git, never checked out (an older head_sha has no scripts/cd).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # DA-C-2 / D-2026-09-29-1 (a): a real manual deploy needs CI to have passed on a push of
      # exactly this SHA to main (workflow_run runs start only after that). Dry runs report.
      - name: CI must have passed on this SHA (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.mode.outputs.sha }}
          REAL: ${{ steps.mode.outputs.real }}
        run: |
          if bash scripts/cd/ci_status.sh verify "$SHA" --branch main; then
            exit 0
          fi
          if [ "$REAL" = true ]; then
            echo "::error::DEPLOY REFUSED — no successful CI push run for $SHA on main"
            exit 1
          fi
          echo "Dry run: a real manual deploy of $SHA would be REFUSED (CI check above)."

      # DA-C-1: the branch head NOW. A SHA that is no longer the tip is skipped (the newer
      # commit's own run deploys it). Empty/unreadable → plan.sh refuses (fail-closed).
      - name: Branch tip at plan time
        id: tip
        if: inputs.skip_tip_check != true
        env:
          REF: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
        run: |
          tip="$(git ls-remote --exit-code origin "$REF" | cut -f1)" || tip=""
          echo "tip of $REF: ${tip:-unknown}"
          echo "tip=$tip" >> "$GITHUB_OUTPUT"

      - name: Plan (tip, last deployed SHA, changed files)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.mode.outputs.sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          CHECK_TIP: ${{ steps.tip.conclusion == 'success' }}
          TIP: ${{ steps.tip.outputs.tip }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          args=(--sha "$SHA")
          [ -z "$BASE_SHA" ] || args+=(--base "$BASE_SHA")
          [ "$CHECK_TIP" != true ] || args+=(--tip "$TIP")
          [ "$FORCE_ALL" != true ] || args+=(--force-all)
          bash scripts/cd/plan.sh "${args[@]}"

  gate-status:
    name: Gate status (secrag/gate-full on the SHA)
    needs: [plan]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/cd
      - name: Refuse a SHA without a local --full PASS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
          # A real run waits for a background publisher (the pre-push hook gates before the
          # push lands); a dry run answers immediately.
          WAIT: ${{ needs.plan.outputs.real == 'true' && '600' || '0' }}
          CREATOR: ${{ vars.GATE_STATUS_CREATOR || github.repository_owner }}
        run: bash scripts/cd/gate_status.sh verify "$SHA" --wait "$WAIT" --creator "$CREATOR"

  dry-run:
    name: Dry run (echo only)
    needs: [plan, gate-status]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.real != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The same order as a real run, one step per stage: a failing stage skips the later ones.
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      REPO: ${{ github.repository }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || '<AZURE_RESOURCE_GROUP>' }}
      # Placeholder digest: a dry run builds nothing.
      JOBS_IMAGE: ghcr.io/${{ github.repository }}-jobs@sha256:<digest-of-the-jobs-image>
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/cd
      - name: 0. Plan and gate status
        id: plan
        env:
          DEPLOY: ${{ needs.plan.outputs.deploy }}
          REASON: ${{ needs.plan.outputs.reason }}
          GATE: ${{ needs.gate-status.result }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "ref=$REF sha=$SHA dry_run=$DRY_RUN"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Not main: a real deploy is never run from this ref."
          fi
          echo "Plan: deploy=$DEPLOY — $REASON"
          if [ "$DEPLOY" != true ]; then
            echo "Would skip build and deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GATE" in
            success) echo "Gate status: secrag/gate-full=success — deploy allowed." ;;
            *) echo "Gate status: DEPLOY REFUSED (no successful secrag/gate-full for $SHA; job result: $GATE)." ;;
          esac
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: 1. Images (per-image plan, T13.CD.1 — build + push only what changed, tags = SHA, deployed by digest)
        if: steps.plan.outputs.go == 'true'
        env:
          BUILD_BACKEND: ${{ needs.plan.outputs.build_backend }}
          BUILD_FRONTEND: ${{ needs.plan.outputs.build_frontend }}
          BUILD_JOBS: ${{ needs.plan.outputs.build_jobs }}
          BUILD_OLLAMA: ${{ needs.plan.outputs.build_ollama }}
        run: |
          plan_line() {
            # $1 label, $2 build flag, $3 note (optional)
            if [ "$2" = true ]; then
              echo "  BUILD  ghcr.io/$REPO-$1:$SHA   $3"
            else
              echo "  KEEP   ghcr.io/$REPO-$1   (unchanged — kept at the currently deployed digest) $3"
            fi
          }
          echo "Per-image plan:"
          plan_line backend "$BUILD_BACKEND"
          plan_line frontend "$BUILD_FRONTEND"
          plan_line ollama "$BUILD_OLLAMA" "(bge-m3 baked in, T11.4.3)"
          plan_line jobs "$BUILD_JOBS" "(migrations, purge, backup)"
      - name: 2. Migration Job (jobs image by digest, start, wait — a failure stops here; always runs on a real deploy, T13.CD.2)
        if: steps.plan.outputs.go == 'true'
        env:
          MIGRATE_JOB: ${{ vars.AZURE_MIGRATE_JOB || '<AZURE_MIGRATE_JOB>' }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          BUILD_JOBS: ${{ needs.plan.outputs.build_jobs }}
        run: |
          if [ "$BUILD_JOBS" = true ]; then
            echo "jobs image: BUILT just now ($JOBS_IMAGE placeholder — a real run uses the images job's digest)"
          else
            echo "jobs image: KEPT — would be read from the migration Job's currently deployed image (scripts/cd/resolve_image.sh), fail-closed if unreadable or not digest-pinned"
          fi
          args=(migrate --rg "$RESOURCE_GROUP" --job "$MIGRATE_JOB" --image "$JOBS_IMAGE" --dry-run)
          [ "$SIMULATE_FAILURE" != true ] || args+=(--simulate-failure)
          bash scripts/cd/azure_jobs.sh "${args[@]}"
      - name: 3. Apps (per-app plan — only the apps whose image changed are updated, by digest)
        if: steps.plan.outputs.go == 'true'
        env:
          OLLAMA_APP: ${{ vars.AZURE_OLLAMA_APP || '<AZURE_OLLAMA_APP>' }}
          BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
          FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
          BUILD_BACKEND: ${{ needs.plan.outputs.build_backend }}
          BUILD_FRONTEND: ${{ needs.plan.outputs.build_frontend }}
          BUILD_OLLAMA: ${{ needs.plan.outputs.build_ollama }}
        run: |
          app_line() {
            # $1 app name, $2 build flag, $3 note
            if [ "$2" = true ]; then
              echo "  UPDATE $1   $3"
            else
              echo "  KEEP   $1   (unchanged — kept at the currently deployed digest, read from Azure)"
            fi
          }
          echo "Would record a deployment and, in order:"
          app_line "$OLLAMA_APP" "$BUILD_OLLAMA" "(ollama — must serve the baked model before backend takes traffic, if also updated)"
          app_line "$BACKEND_APP" "$BUILD_BACKEND" ""
          app_line "$FRONTEND_APP" "$BUILD_FRONTEND" ""
          echo "(rg $RESOURCE_GROUP)"
      - name: 4. Post-deploy health check (backend via the frontend's BFF, frontend /)
        if: steps.plan.outputs.go == 'true'
        run: |
          echo "Would resolve the frontend's public ingress URL and poll:"
          echo "  scripts/cd/health_check.sh <frontend_url>/api/health --timeout 180"
          echo "  scripts/cd/health_check.sh <frontend_url>/ --timeout 180"
          echo "DEC-005 (T12.5.6): the backend has no public URL to poll directly any more"
          echo "once ingress goes internal (T12.6b.5) -- /api/health is the BFF's own"
          echo "proxy of the backend's /health, so this still proves the backend answers."
          echo "A failed poll fails this run — the apps are already updated, never rolled back."
      - name: 5. Purge and backup Job images (digest; schedules never touched)
        if: steps.plan.outputs.go == 'true'
        env:
          PURGE_JOB: ${{ vars.AZURE_PURGE_JOB || '<AZURE_PURGE_JOB>' }}
          BACKUP_JOB: ${{ vars.AZURE_BACKUP_JOB || '<AZURE_BACKUP_JOB>' }}
          BUILD_JOBS: ${{ needs.plan.outputs.build_jobs }}
        run: |
          if [ "$BUILD_JOBS" = true ]; then
            for job in "$PURGE_JOB" "$BACKUP_JOB"; do
              bash scripts/cd/azure_jobs.sh update-image --rg "$RESOURCE_GROUP" --job "$job" --image "$JOBS_IMAGE" --dry-run
            done
          else
            echo "jobs image unchanged: would cross-check (DA-13-0-1) that $PURGE_JOB and $BACKUP_JOB still carry"
            echo "the migration Job's resolved image (scripts/cd/resolve_image.sh job --build false), fail-closed"
            echo "on a mismatch, no auto-repair"
          fi
          echo "Schedules are never enabled by CD (manual switch, runbook)."

  images:
    name: Build & push images (GHCR, only what the plan flagged — T13.CD.2)
    needs: [plan, gate-status]
    if: needs.plan.outputs.real == 'true' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      jobs_digest: ${{ steps.jobs.outputs.digest }}
      ollama_digest: ${{ steps.ollama.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        id: backend
        if: needs.plan.outputs.build_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Build & push frontend
        id: frontend
        if: needs.plan.outputs.build_frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          # No build-time backend URL any more (T12.1.7): the UI calls relative /api/...
          # paths, proxied by the BFF route handlers using the server-side BACKEND_URL
          # (an Azure app setting, T12.6a.3) -- nothing to bake in here.
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

      # Slim jobs image (T11.2.12): migration, purge and backup Jobs.
      - name: Build & push jobs image
        id: jobs
        if: needs.plan.outputs.build_jobs == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.jobs
          build-contexts: |
            dbscripts=./scripts/db
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-jobs:latest
            ghcr.io/${{ github.repository }}-jobs:${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=jobs-image
          cache-to: type=gha,mode=max,scope=jobs-image

      # Custom Ollama image (T11.4.3): `bge-m3` baked in at build time — see ollama/Dockerfile.
      - name: Build & push ollama image
        id: ollama
        if: needs.plan.outputs.build_ollama == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./ollama
          file: ./ollama/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ollama:latest
            ghcr.io/${{ github.repository }}-ollama:${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=ollama-image
          cache-to: type=gha,mode=max,scope=ollama-image

      # Empty for any image the plan did not flag — resolved instead from the currently
      # deployed digest by scripts/cd/resolve_image.sh in `migrate`/`deploy` (T13.CD.2).
      - name: Digests (built just now; empty for an unchanged, skipped image)
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          JOBS_DIGEST: ${{ steps.jobs.outputs.digest }}
          OLLAMA_DIGEST: ${{ steps.ollama.outputs.digest }}
        run: |
          echo "backend  ${BACKEND_DIGEST:-(kept)}"
          echo "frontend ${FRONTEND_DIGEST:-(kept)}"
          echo "ollama   ${OLLAMA_DIGEST:-(kept)}"
          echo "jobs     ${JOBS_DIGEST:-(kept)}"

  # T11.2.6: migrations run as an Azure Container Apps Job from the jobs image, BEFORE the apps.
  # A failed or timed-out execution fails this job, so `deploy` (apps + Job images) never runs.
  migrate:
    name: Migration Job (before the apps)
    needs: [plan, images]
    if: needs.plan.outputs.real == 'true' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC
      contents: read
      statuses: read
    outputs:
      # DA-13-0-1: exposed so `deploy` can cross-check the purge/backup Jobs against the
      # exact image this run just verified for the migration Job, when build_jobs is false.
      jobs_image: ${{ steps.resolve.outputs.jobs_image }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      MIGRATE_JOB: ${{ vars.AZURE_MIGRATE_JOB }}
      BUILD_JOBS: ${{ needs.plan.outputs.build_jobs }}
      JOBS_BUILT_DIGEST: ${{ needs.images.outputs.jobs_digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/cd

      # Defence in depth: nothing reaches Azure without a local --full PASS for the SHA.
      - name: Refuse a SHA without secrag/gate-full (D-2026-09-27-7 b)
        env:
          CREATOR: ${{ vars.GATE_STATUS_CREATOR || github.repository_owner }}
        run: bash scripts/cd/gate_status.sh verify "$SHA" --creator "$CREATOR"

      - name: Azure login (OIDC federated credentials)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # T13.CD.2: the migration Job ALWAYS runs on a real deploy (simpler/safer than a
      # conditional step, and backend/** changing always flags the jobs image too) — but the
      # jobs image itself follows the per-image plan: built just now, or (BUILD_JOBS=false)
      # the one already deployed on this Job, fail-closed via scripts/cd/resolve_image.sh.
      - name: Resolve the jobs image, update the migration Job, start it, wait (stop on failure)
        id: resolve
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          JOBS_IMAGE="$(bash scripts/cd/resolve_image.sh job --rg "$RESOURCE_GROUP" --name "$MIGRATE_JOB" --repo "ghcr.io/$GH_REPO-jobs" --build "$BUILD_JOBS" --built-digest "$JOBS_BUILT_DIGEST")"
          echo "jobs_image=$JOBS_IMAGE" >> "$GITHUB_OUTPUT"
          bash scripts/cd/azure_jobs.sh migrate --rg "$RESOURCE_GROUP" --job "$MIGRATE_JOB" --image "$JOBS_IMAGE"

  deploy:
    name: Deploy to Azure Container Apps
    needs: [plan, images, migrate]
    if: needs.plan.outputs.real == 'true' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: mint a short-lived token, no long-lived secrets stored
      contents: read
      deployments: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/cd

      # Defence in depth: the deploy job itself refuses a SHA without a local --full PASS.
      - name: Refuse a SHA without secrag/gate-full (D-2026-09-27-7 b)
        env:
          CREATOR: ${{ vars.GATE_STATUS_CREATOR || github.repository_owner }}
        run: bash scripts/cd/gate_status.sh verify "$SHA" --creator "$CREATOR"

      - name: Azure login (OIDC federated credentials)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # T13.CD.2: each app's image is the one built just now, or — when the plan did not
      # flag it — the one CURRENTLY DEPLOYED on that app, read via scripts/cd/resolve_image.sh
      # (fail-closed if unreadable or not pinned by digest). Resolved even for an app that
      # will not be updated this run: still proves it is in a sane, digest-pinned state.
      - name: Resolve app image digests (built just now, or the currently deployed ones)
        id: resolve
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          OLLAMA_APP: ${{ vars.AZURE_OLLAMA_APP }}
          BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
          FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
          BUILD_OLLAMA: ${{ needs.plan.outputs.build_ollama }}
          BUILD_BACKEND: ${{ needs.plan.outputs.build_backend }}
          BUILD_FRONTEND: ${{ needs.plan.outputs.build_frontend }}
          OLLAMA_BUILT_DIGEST: ${{ needs.images.outputs.ollama_digest }}
          BACKEND_BUILT_DIGEST: ${{ needs.images.outputs.backend_digest }}
          FRONTEND_BUILT_DIGEST: ${{ needs.images.outputs.frontend_digest }}
        run: |
          [ -n "$OLLAMA_APP" ] || { echo "::error::AZURE_OLLAMA_APP repo variable is not set"; exit 1; }
          [ -n "$BACKEND_APP" ] || { echo "::error::AZURE_BACKEND_APP repo variable is not set"; exit 1; }
          [ -n "$FRONTEND_APP" ] || { echo "::error::AZURE_FRONTEND_APP repo variable is not set"; exit 1; }
          [ -n "$RESOURCE_GROUP" ] || { echo "::error::AZURE_RESOURCE_GROUP repo variable is not set"; exit 1; }
          ollama_image="$(bash scripts/cd/resolve_image.sh app --rg "$RESOURCE_GROUP" --name "$OLLAMA_APP" --repo "ghcr.io/$REPO-ollama" --build "$BUILD_OLLAMA" --built-digest "$OLLAMA_BUILT_DIGEST")"
          backend_image="$(bash scripts/cd/resolve_image.sh app --rg "$RESOURCE_GROUP" --name "$BACKEND_APP" --repo "ghcr.io/$REPO-backend" --build "$BUILD_BACKEND" --built-digest "$BACKEND_BUILT_DIGEST")"
          frontend_image="$(bash scripts/cd/resolve_image.sh app --rg "$RESOURCE_GROUP" --name "$FRONTEND_APP" --repo "ghcr.io/$REPO-frontend" --build "$BUILD_FRONTEND" --built-digest "$FRONTEND_BUILT_DIGEST")"
          echo "ollama_image=$ollama_image" >> "$GITHUB_OUTPUT"
          echo "backend_image=$backend_image" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"

      - name: Images must be pinned by digest
        env:
          BACKEND_IMAGE: ${{ steps.resolve.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.resolve.outputs.frontend_image }}
          OLLAMA_IMAGE: ${{ steps.resolve.outputs.ollama_image }}
        run: |
          case "$BACKEND_IMAGE $FRONTEND_IMAGE $OLLAMA_IMAGE" in
            *@sha256:*@sha256:*@sha256:*)
              echo "backend  $BACKEND_IMAGE"
              echo "frontend $FRONTEND_IMAGE"
              echo "ollama   $OLLAMA_IMAGE" ;;
            *) echo "::error::missing image digest"; exit 1 ;;
          esac

      # Recorded through the REST API rather than a job `environment:` key, which would
      # change the OIDC subject and break the federated credential.
      - name: Record deployment (GitHub Deployments API)
        id: record
        run: |
          id=$(jq -n --arg ref "$SHA" \
                 '{ref: $ref, environment: "azure", auto_merge: false, required_contexts: [],
                   description: "CD deploy to Azure Container Apps"}' \
               | gh api -X POST "repos/$REPO/deployments" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=in_progress > /dev/null

      # T11.4.3 / T13.CD.2: `secrag-ollama` updates FIRST, when it changed too — see the order
      # note at the top of this file (the backend calls Ollama synchronously for embeddings,
      # so it must already be serving the baked-in model before backend's new revision can
      # take traffic). An app the plan did NOT flag is left untouched (no `containerapp
      # update` call) — it already runs the image resolved above.
      - name: Deploy new images to the Container Apps (by digest; only the apps that changed, ollama before backend/frontend)
        uses: azure/cli@v3
        # DA-13-0-2: every value this script needs reaches it through `env:` below — never
        # pasted as a `${{ }}` expression into `inlineScript` itself (DA-C2-3; a ref name or
        # a digest could in principle contain shell metacharacters). azure/cli@v3 forwards
        # the step's own environment into the container that runs the script (verified
        # against its source, github.com/Azure/cli `src/main.ts`: it copies `process.env`
        # into `docker run -e …`), so plain `env:` works the same way `run:` steps use it.
        env:
          OLLAMA_APP: ${{ vars.AZURE_OLLAMA_APP }}
          BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
          FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BUILD_OLLAMA: ${{ needs.plan.outputs.build_ollama }}
          BUILD_BACKEND: ${{ needs.plan.outputs.build_backend }}
          BUILD_FRONTEND: ${{ needs.plan.outputs.build_frontend }}
          OLLAMA_IMAGE: ${{ steps.resolve.outputs.ollama_image }}
          BACKEND_IMAGE: ${{ steps.resolve.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.resolve.outputs.frontend_image }}
        with:
          azcliversion: latest
          # DA-11bD-2: explicit, not relied on from azure/cli@v3's own (undocumented)
          # default — a failed `az containerapp update` (e.g. a missing/stale
          # AZURE_OLLAMA_APP, now that this step can deploy up to three apps) must stop this
          # script before the NEXT app is touched, never leave a partial deploy. The repo-var
          # check below fails the same way, before any app is touched at all, if a var was
          # never set (defence in depth: the resolve step above already checked this).
          inlineScript: |
            set -euo pipefail
            [ -n "${OLLAMA_APP:-}" ] || { echo "::error::AZURE_OLLAMA_APP repo variable is not set"; exit 1; }
            [ -n "${BACKEND_APP:-}" ] || { echo "::error::AZURE_BACKEND_APP repo variable is not set"; exit 1; }
            [ -n "${FRONTEND_APP:-}" ] || { echo "::error::AZURE_FRONTEND_APP repo variable is not set"; exit 1; }
            [ -n "${RESOURCE_GROUP:-}" ] || { echo "::error::AZURE_RESOURCE_GROUP repo variable is not set"; exit 1; }
            if [ "$BUILD_OLLAMA" = true ]; then
              az containerapp update \
                --name "$OLLAMA_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --image "$OLLAMA_IMAGE"
            fi
            if [ "$BUILD_BACKEND" = true ]; then
              az containerapp update \
                --name "$BACKEND_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --image "$BACKEND_IMAGE"
            fi
            if [ "$BUILD_FRONTEND" = true ]; then
              az containerapp update \
                --name "$FRONTEND_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --image "$FRONTEND_IMAGE"
            fi

      # Post-deploy health check (deferred from 11a, done in 11b block D; DEC-005/T12.5.6,
      # 2026-11-12, routes the backend half through the frontend's own BFF instead of the
      # backend's public FQDN -- the backend has no public URL to poll directly once ingress
      # goes internal, T12.6b.5). A broken revision must fail this CD run, not go live
      # unnoticed. Public ingress URL only (no secret, no query string); scripts/cd/
      # health_check.sh never prints a response body.
      - name: Resolve the frontend's public URL
        id: urls
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
        run: |
          frontend_fqdn="$(az containerapp show --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          [ -n "$frontend_fqdn" ] || { echo "::error::frontend ingress FQDN is empty"; exit 1; }
          echo "frontend_url=https://$frontend_fqdn" >> "$GITHUB_OUTPUT"

      - name: Backend health check (via the frontend's BFF, /api/health)
        env:
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: bash scripts/cd/health_check.sh "$FRONTEND_URL/api/health" --timeout 180

      - name: Frontend health check (/)
        env:
          FRONTEND_URL: ${{ steps.urls.outputs.frontend_url }}
        run: bash scripts/cd/health_check.sh "$FRONTEND_URL/" --timeout 180

      # X1 / T11.2.11: the purge and backup Jobs follow the deployed digest (jobs image), after
      # the apps. `job update --image` only — never per-execution overrides, never schedules.
      # T13.CD.2: only when the jobs image itself changed this run — `migrate` already
      # resolved and verified it (fail-closed) a moment ago in this same pipeline run;
      # unchanged Job images are left untouched (they already carry that digest from before).
      - name: Update the purge and backup Job images (by digest)
        if: needs.plan.outputs.build_jobs == 'true'
        env:
          JOBS_IMAGE: ghcr.io/${{ github.repository }}-jobs@${{ needs.images.outputs.jobs_digest }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PURGE_JOB: ${{ vars.AZURE_PURGE_JOB }}
          BACKUP_JOB: ${{ vars.AZURE_BACKUP_JOB }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          for job in "$PURGE_JOB" "$BACKUP_JOB"; do
            bash scripts/cd/azure_jobs.sh update-image --rg "$RESOURCE_GROUP" --job "$job" --image "$JOBS_IMAGE"
          done

      # DA-13-0-1: when build_jobs stayed false this run, nothing above re-reads the
      # purge/backup Jobs' own currently deployed image — an out-of-band `job update` run by
      # hand on only one of the three Jobs (e.g. during an incident) would otherwise desync
      # them from the migration Job without CD ever noticing. Cheap, read-only, fail-closed:
      # resolve each Job's own image the same way `migrate` just did and compare — no
      # auto-repair, a mismatch stops the run so a human looks at it.
      - name: Purge/backup Job images must match the migration Job's (DA-13-0-1)
        if: needs.plan.outputs.build_jobs != 'true'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PURGE_JOB: ${{ vars.AZURE_PURGE_JOB }}
          BACKUP_JOB: ${{ vars.AZURE_BACKUP_JOB }}
          MIGRATE_IMAGE: ${{ needs.migrate.outputs.jobs_image }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          [ -n "$MIGRATE_IMAGE" ] || { echo "::error::the migration Job's resolved image is empty — cannot cross-check"; exit 1; }
          for job in "$PURGE_JOB" "$BACKUP_JOB"; do
            image="$(bash scripts/cd/resolve_image.sh job --rg "$RESOURCE_GROUP" --name "$job" --repo "ghcr.io/$REPO-jobs" --build false)"
            if [ "$image" != "$MIGRATE_IMAGE" ]; then
              echo "::error::Job '$job' image ($image) does not match the migration Job's image ($MIGRATE_IMAGE) — refusing (no auto-repair)"
              exit 1
            fi
          done
          echo "purge/backup Job images match the migration Job's: $MIGRATE_IMAGE"

      - name: Record deployment status
        if: always() && steps.record.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api -X POST "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$STATE" > /dev/null
