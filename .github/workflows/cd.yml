name: CD

# Deploys `main` to Azure Container Apps after CI has succeeded on it (T11.0.9, PHASE_PLANNING
# §1 rule 2). The cloud path uses a hosted LLM (Azure OpenAI via LLM_PROVIDER); see
# docs/adr/adr_phase10_azure.md and docs/adr/adr_phase11_stability.md.
#
#   plan         changed files vs the LAST DEPLOYED SHA (GitHub Deployments); only docs/**,
#                **/*.md or deploy/k8s/** changed → build and deploy are skipped
#   gate-status  the SHA must carry the commit status `secrag/gate-full` = success, posted by
#                `scripts/gate.sh --full` for exactly that SHA (D-2026-09-27-7 b); otherwise
#                the deploy is REFUSED (a skipped pre-push hook can no longer reach Azure)
#   images       build + push, tagged with the SHA; deployed BY DIGEST
#   deploy       re-checks the gate status, records a deployment, updates the apps
#
# One SHA everywhere: head_sha of the CI run (workflow_run) or the dispatched commit.
# Manual runs (workflow_dispatch) default to dry_run=true: plan + gate-status run (read-only)
# and an echo job prints what a real run would do. A real manual deploy needs dry_run=false
# AND the main branch. base_sha/head_sha inputs exist to test the plan in dry runs only.
# No job uses `environment:`, so the OIDC subject stays repo:<owner>/<repo>:ref:refs/heads/main
# (runbook, gotcha 8). CD never enables Job schedules and never applies Job YAML (X1); the
# migration Job and Job image updates come with T11.2.6.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only plan and echo what would be built and deployed"
        type: boolean
        default: true
      base_sha:
        description: "Dry runs only: compare with this SHA instead of the last deployed one"
        type: string
        default: ""
      head_sha:
        description: "Dry runs only: plan this SHA instead of the dispatched ref's head"
        type: string
        default: ""

# Real deploys are serialised in one group and never cancelled mid-flight; dry runs and
# echo runs get their own group so they can never replace a pending real deploy.
concurrency:
  group: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run == false)) && 'cd-main' || format('cd-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (changed files vs last deployed SHA)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      real: ${{ steps.mode.outputs.real }}
      sha: ${{ steps.plan.outputs.sha }}
      deploy: ${{ steps.plan.outputs.deploy }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Mode and SHA
        id: mode
        env:
          REAL: ${{ github.event_name == 'workflow_run' || (github.ref == 'refs/heads/main' && inputs.dry_run == false) }}
          SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }} dry_run=${{ inputs.dry_run }} real=$REAL sha=$SHA"
          if [ "${{ github.event_name }}" = workflow_run ]; then
            echo "CI succeeded for ${{ github.event.workflow_run.head_branch }}@${{ github.event.workflow_run.head_sha }}"
          fi
          if [ "$REAL" = true ] && [ -n "$BASE_SHA$HEAD_SHA" ]; then
            echo "::error::base_sha/head_sha are for dry runs only; a real deploy uses the dispatched commit"
            exit 1
          fi
          echo "real=$REAL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.mode.outputs.sha }}
          fetch-depth: 0

      - name: Changed files vs the last deployed SHA
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.mode.outputs.sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: bash scripts/cd/plan.sh --sha "$SHA" ${BASE_SHA:+--base "$BASE_SHA"}

  gate-status:
    name: Gate status (secrag/gate-full on the SHA)
    needs: [plan]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cd
      - name: Refuse a SHA without a local --full PASS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
          # A real run waits for a background publisher (the pre-push hook gates before the
          # push lands); a dry run answers immediately.
          WAIT: ${{ needs.plan.outputs.real == 'true' && '600' || '0' }}
          CREATOR: ${{ vars.GATE_STATUS_CREATOR || github.repository_owner }}
        run: bash scripts/cd/gate_status.sh verify "$SHA" --wait "$WAIT" --creator "$CREATOR"

  dry-run:
    name: Dry run (echo only)
    needs: [plan, gate-status]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.real != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Echo what a real deploy would do
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          DEPLOY: ${{ needs.plan.outputs.deploy }}
          REASON: ${{ needs.plan.outputs.reason }}
          GATE: ${{ needs.gate-status.result }}
        run: |
          echo "ref=${{ github.ref }} sha=$SHA dry_run=${{ inputs.dry_run }}"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Not main: a real deploy is never run from this ref."
          fi
          echo "Plan: deploy=$DEPLOY — $REASON"
          if [ "$DEPLOY" != true ]; then
            echo "Would skip build and deploy."
            exit 0
          fi
          case "$GATE" in
            success) echo "Gate status: secrag/gate-full=success — deploy allowed." ;;
            *) echo "Gate status: DEPLOY REFUSED (no successful secrag/gate-full for $SHA; job result: $GATE)." ;;
          esac
          echo "Would build and push (order: images → apps; tags = SHA, deploy by digest):"
          echo "  ghcr.io/${{ github.repository }}-backend:$SHA"
          echo "  ghcr.io/${{ github.repository }}-frontend:$SHA"
          echo "Would deploy by digest to: ${{ vars.AZURE_BACKEND_APP }}, ${{ vars.AZURE_FRONTEND_APP }} (rg ${{ vars.AZURE_RESOURCE_GROUP }})"
          echo "Jobs: none updated yet (migration Job + Job digests come with T11.2.6); schedules are never enabled by CD."

  images:
    name: Build & push images (GHCR)
    needs: [plan, gate-status]
    if: needs.plan.outputs.real == 'true' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ needs.plan.outputs.sha }}

      - name: Build & push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          # NEXT_PUBLIC_* is baked at build time, so the public backend URL must be set
          # here (repo variable) for the cloud image; falls back to localhost for a
          # local/dev build.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ needs.plan.outputs.sha }}

      - name: Digests
        run: |
          echo "backend  ${{ steps.backend.outputs.digest }}"
          echo "frontend ${{ steps.frontend.outputs.digest }}"

  deploy:
    name: Deploy to Azure Container Apps
    needs: [plan, images]
    if: needs.plan.outputs.real == 'true' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: mint a short-lived token, no long-lived secrets stored
      contents: read
      deployments: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend@${{ needs.images.outputs.backend_digest }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend@${{ needs.images.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cd

      # Defence in depth: the deploy job itself refuses a SHA without a local --full PASS.
      - name: Refuse a SHA without secrag/gate-full (D-2026-09-27-7 b)
        env:
          CREATOR: ${{ vars.GATE_STATUS_CREATOR || github.repository_owner }}
        run: bash scripts/cd/gate_status.sh verify "$SHA" --creator "$CREATOR"

      - name: Images must be pinned by digest
        run: |
          case "$BACKEND_IMAGE $FRONTEND_IMAGE" in
            *@sha256:*@sha256:*) echo "backend  $BACKEND_IMAGE"; echo "frontend $FRONTEND_IMAGE" ;;
            *) echo "::error::missing image digest"; exit 1 ;;
          esac

      # Recorded through the REST API rather than a job `environment:` key, which would
      # change the OIDC subject and break the federated credential.
      - name: Record deployment (GitHub Deployments API)
        id: record
        run: |
          id=$(jq -n --arg ref "$SHA" \
                 '{ref: $ref, environment: "azure", auto_merge: false, required_contexts: [],
                   description: "CD deploy to Azure Container Apps"}' \
               | gh api -X POST "repos/$REPO/deployments" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=in_progress > /dev/null

      - name: Azure login (OIDC federated credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new images to the Container Apps (by digest)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_BACKEND_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "ghcr.io/${{ github.repository }}-backend@${{ needs.images.outputs.backend_digest }}"
            az containerapp update \
              --name "${{ vars.AZURE_FRONTEND_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "ghcr.io/${{ github.repository }}-frontend@${{ needs.images.outputs.frontend_digest }}"

      - name: Record deployment status
        if: always() && steps.record.outputs.id != ''
        run: |
          gh api -X POST "repos/$REPO/deployments/${{ steps.record.outputs.id }}/statuses" \
            -f state="${{ job.status == 'success' && 'success' || 'failure' }}" > /dev/null
