name: CD

# Deploys `main` to Azure Container Apps after CI has succeeded on it (T11.0.9, PHASE_PLANNING
# §1 rule 2). The cloud path uses a hosted LLM (Azure OpenAI via LLM_PROVIDER); see
# docs/adr/adr_phase10_azure.md and docs/adr/adr_phase11_stability.md.
#
#   plan         skip a SHA that is no longer the branch tip at plan time or that is not newer
#                than the LAST DEPLOYED SHA (equal to it or an ancestor: CD never rolls back,
#                DA-C-1); then changed files vs that SHA (GitHub Deployments): only docs/**,
#                **/*.md or deploy/k8s/** changed → build and deploy are skipped. A real
#                manual deploy also needs a successful CI push run for the SHA on main
#                (DA-C-2, D-2026-09-29-1 a); dry runs only report that check.
#   gate-status  the SHA must carry the commit status `secrag/gate-full` = success, posted by
#                `scripts/gate.sh --full` for exactly that SHA (D-2026-09-27-7 b); otherwise
#                the deploy is REFUSED (a skipped pre-push hook can no longer reach Azure)
#   images       build + push backend, frontend and the slim jobs image, tagged with the SHA;
#                deployed BY DIGEST
#   migrate      re-checks the gate status; the migration Job gets the jobs image (digest) and
#                is started with no overrides; CD waits and STOPS on a failure, before the apps
#                (scripts/cd/azure_jobs.sh, T11.2.6)
#   deploy       re-checks the gate status, records a deployment, updates the apps, then the
#                purge and backup Jobs' images (digest, X1; T11.2.11)
#
# Order: images → migrate Job → apps → Job images. Job names come from repo variables
# (AZURE_MIGRATE_JOB, AZURE_PURGE_JOB, AZURE_BACKUP_JOB); the Jobs themselves are created by
# hand from deploy/azure/jobs/*.yaml (runbook) — CD never applies YAML or enables schedules.
#
# One SHA everywhere: head_sha of the CI run (workflow_run) or the dispatched commit.
# Manual runs (workflow_dispatch) default to dry_run=true: plan + gate-status run (read-only)
# and an echo job prints what a real run would do. A real manual deploy needs dry_run=false
# AND the main branch. base_sha/head_sha/skip_tip_check exist to test the plan in dry runs only,
# simulate_failure to show the migrate-failure path in a dry run.
# No job uses `environment:`, so the OIDC subject stays repo:<owner>/<repo>:ref:refs/heads/main
# (runbook, gotcha 8). CD never enables Job schedules and never applies Job YAML (X1).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only plan and echo what would be built and deployed"
        type: boolean
        default: true
      base_sha:
        description: "Dry runs only: compare with this SHA instead of the last deployed one"
        type: string
        default: ""
      head_sha:
        description: "Dry runs only: plan this SHA instead of the dispatched ref's head"
        type: string
        default: ""
      skip_tip_check:
        description: "Dry runs only: plan head_sha even if it is not the ref's tip"
        type: boolean
        default: false
      simulate_failure:
        description: "Dry runs only: the migration Job 'fails', to show the pipeline stops there"
        type: boolean
        default: false

# Real deploys are serialised in one group and never cancelled mid-flight; dry runs and
# echo runs get their own group so they can never replace a pending real deploy.
concurrency:
  group: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run == false)) && 'cd-main' || format('cd-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (changed files vs last deployed SHA)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: read       # ci_status.sh: CI runs of the SHA
      contents: read
      deployments: read
    outputs:
      real: ${{ steps.mode.outputs.real }}
      sha: ${{ steps.plan.outputs.sha }}
      deploy: ${{ steps.plan.outputs.deploy }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Mode and SHA
        id: mode
        env:
          REAL: ${{ github.event_name == 'workflow_run' || (github.ref == 'refs/heads/main' && inputs.dry_run == false) }}
          SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SKIP_TIP_CHECK: ${{ inputs.skip_tip_check }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          # DA-C2-3: every expression reaches the shell through env, never pasted into
          # `run:` (a ref name may contain `$(`, `;` or backticks).
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "event=$EVENT ref=$REF dry_run=$DRY_RUN real=$REAL sha=$SHA"
          if [ "$EVENT" = workflow_run ]; then
            echo "CI succeeded for $CI_BRANCH@$CI_SHA"
          fi
          if [ "$REAL" = true ] && { [ -n "$BASE_SHA$HEAD_SHA" ] || [ "$SKIP_TIP_CHECK" = true ] || [ "$SIMULATE_FAILURE" = true ]; }; then
            echo "::error::base_sha/head_sha/skip_tip_check/simulate_failure are for dry runs only; a real deploy uses the dispatched commit"
            exit 1
          fi
          echo "real=$REAL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The workflow's own revision (for scripts/cd) with full history: the SHAs to compare
      # are read from git, never checked out (an older head_sha has no scripts/cd).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DA-C-2 / D-2026-09-29-1 (a): a real manual deploy needs CI to have passed on a push of
      # exactly this SHA to main (workflow_run runs start only after that). Dry runs report.
      - name: CI must have passed on this SHA (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.mode.outputs.sha }}
          REAL: ${{ steps.mode.outputs.real }}
        run: |
          if bash scripts/cd/ci_status.sh verify "$SHA" --branch main; then
            exit 0
          fi
          if [ "$REAL" = true ]; then
            echo "::error::DEPLOY REFUSED — no successful CI push run for $SHA on main"
            exit 1
          fi
          echo "Dry run: a real manual deploy of $SHA would be REFUSED (CI check above)."

      # DA-C-1: the branch head NOW. A SHA that is no longer the tip is skipped (the newer
      # commit's own run deploys it). Empty/unreadable → plan.sh refuses (fail-closed).
      - name: Branch tip at plan time
        id: tip
        if: inputs.skip_tip_check != true
        env:
          REF: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
        run: |
          tip="$(git ls-remote --exit-code origin "$REF" | cut -f1)" || tip=""
          echo "tip of $REF: ${tip:-unknown}"
          echo "tip=$tip" >> "$GITHUB_OUTPUT"

      - name: Plan (tip, last deployed SHA, changed files)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.mode.outputs.sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          CHECK_TIP: ${{ steps.tip.conclusion == 'success' }}
          TIP: ${{ steps.tip.outputs.tip }}
        run: |
          args=(--sha "$SHA")
          [ -z "$BASE_SHA" ] || args+=(--base "$BASE_SHA")
          [ "$CHECK_TIP" != true ] || args+=(--tip "$TIP")
          bash scripts/cd/plan.sh "${args[@]}"

  gate-status:
    name: Gate status (secrag/gate-full on the SHA)
    needs: [plan]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cd
      - name: Refuse a SHA without a local --full PASS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
          # A real run waits for a background publisher (the pre-push hook gates before the
          # push lands); a dry run answers immediately.
          WAIT: ${{ needs.plan.outputs.real == 'true' && '600' || '0' }}
          CREATOR: ${{ vars.GATE_STATUS_CREATOR || github.repository_owner }}
        run: bash scripts/cd/gate_status.sh verify "$SHA" --wait "$WAIT" --creator "$CREATOR"

  dry-run:
    name: Dry run (echo only)
    needs: [plan, gate-status]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.real != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The same order as a real run, one step per stage: a failing stage skips the later ones.
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      REPO: ${{ github.repository }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || '<AZURE_RESOURCE_GROUP>' }}
      # Placeholder digest: a dry run builds nothing.
      JOBS_IMAGE: ghcr.io/${{ github.repository }}-jobs@sha256:<digest-of-the-jobs-image>
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cd
      - name: 0. Plan and gate status
        id: plan
        env:
          DEPLOY: ${{ needs.plan.outputs.deploy }}
          REASON: ${{ needs.plan.outputs.reason }}
          GATE: ${{ needs.gate-status.result }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "ref=$REF sha=$SHA dry_run=$DRY_RUN"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Not main: a real deploy is never run from this ref."
          fi
          echo "Plan: deploy=$DEPLOY — $REASON"
          if [ "$DEPLOY" != true ]; then
            echo "Would skip build and deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GATE" in
            success) echo "Gate status: secrag/gate-full=success — deploy allowed." ;;
            *) echo "Gate status: DEPLOY REFUSED (no successful secrag/gate-full for $SHA; job result: $GATE)." ;;
          esac
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: 1. Images (build + push, tags = SHA, deployed by digest)
        if: steps.plan.outputs.go == 'true'
        run: |
          echo "Would build and push:"
          echo "  ghcr.io/$REPO-backend:$SHA"
          echo "  ghcr.io/$REPO-frontend:$SHA"
          echo "  ghcr.io/$REPO-jobs:$SHA   (slim jobs image: migrations, purge, backup)"
      - name: 2. Migration Job (jobs image by digest, start, wait — a failure stops here)
        if: steps.plan.outputs.go == 'true'
        env:
          MIGRATE_JOB: ${{ vars.AZURE_MIGRATE_JOB || '<AZURE_MIGRATE_JOB>' }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          args=(migrate --rg "$RESOURCE_GROUP" --job "$MIGRATE_JOB" --image "$JOBS_IMAGE" --dry-run)
          [ "$SIMULATE_FAILURE" != true ] || args+=(--simulate-failure)
          bash scripts/cd/azure_jobs.sh "${args[@]}"
      - name: 3. Apps (backend, frontend by digest)
        if: steps.plan.outputs.go == 'true'
        env:
          BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
          FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
        run: |
          echo "Would record a deployment and update by digest: $BACKEND_APP, $FRONTEND_APP (rg $RESOURCE_GROUP)"
      - name: 4. Purge and backup Job images (digest; schedules never touched)
        if: steps.plan.outputs.go == 'true'
        env:
          PURGE_JOB: ${{ vars.AZURE_PURGE_JOB || '<AZURE_PURGE_JOB>' }}
          BACKUP_JOB: ${{ vars.AZURE_BACKUP_JOB || '<AZURE_BACKUP_JOB>' }}
        run: |
          for job in "$PURGE_JOB" "$BACKUP_JOB"; do
            bash scripts/cd/azure_jobs.sh update-image --rg "$RESOURCE_GROUP" --job "$job" --image "$JOBS_IMAGE" --dry-run
          done
          echo "Schedules are never enabled by CD (manual switch, runbook)."

  images:
    name: Build & push images (GHCR)
    needs: [plan, gate-status]
    if: needs.plan.outputs.real == 'true' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      jobs_digest: ${{ steps.jobs.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ needs.plan.outputs.sha }}

      - name: Build & push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          # NEXT_PUBLIC_* is baked at build time, so the public backend URL must be set
          # here (repo variable) for the cloud image; falls back to localhost for a
          # local/dev build.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ needs.plan.outputs.sha }}

      # Slim jobs image (T11.2.12): migration, purge and backup Jobs.
      - name: Build & push jobs image
        id: jobs
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.jobs
          build-contexts: |
            dbscripts=./scripts/db
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-jobs:latest
            ghcr.io/${{ github.repository }}-jobs:${{ needs.plan.outputs.sha }}

      - name: Digests
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          JOBS_DIGEST: ${{ steps.jobs.outputs.digest }}
        run: |
          echo "backend  $BACKEND_DIGEST"
          echo "frontend $FRONTEND_DIGEST"
          echo "jobs     $JOBS_DIGEST"

  # T11.2.6: migrations run as an Azure Container Apps Job from the jobs image, BEFORE the apps.
  # A failed or timed-out execution fails this job, so `deploy` (apps + Job images) never runs.
  migrate:
    name: Migration Job (before the apps)
    needs: [plan, images]
    if: needs.plan.outputs.real == 'true' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC
      contents: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      JOBS_IMAGE: ghcr.io/${{ github.repository }}-jobs@${{ needs.images.outputs.jobs_digest }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      MIGRATE_JOB: ${{ vars.AZURE_MIGRATE_JOB }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cd

      # Defence in depth: nothing reaches Azure without a local --full PASS for the SHA.
      - name: Refuse a SHA without secrag/gate-full (D-2026-09-27-7 b)
        env:
          CREATOR: ${{ vars.GATE_STATUS_CREATOR || github.repository_owner }}
        run: bash scripts/cd/gate_status.sh verify "$SHA" --creator "$CREATOR"

      - name: Azure login (OIDC federated credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update the migration Job to the jobs image, start it, wait (stop on failure)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          bash scripts/cd/azure_jobs.sh migrate --rg "$RESOURCE_GROUP" --job "$MIGRATE_JOB" --image "$JOBS_IMAGE"

  deploy:
    name: Deploy to Azure Container Apps
    needs: [plan, images, migrate]
    if: needs.plan.outputs.real == 'true' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: mint a short-lived token, no long-lived secrets stored
      contents: read
      deployments: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend@${{ needs.images.outputs.backend_digest }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend@${{ needs.images.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cd

      # Defence in depth: the deploy job itself refuses a SHA without a local --full PASS.
      - name: Refuse a SHA without secrag/gate-full (D-2026-09-27-7 b)
        env:
          CREATOR: ${{ vars.GATE_STATUS_CREATOR || github.repository_owner }}
        run: bash scripts/cd/gate_status.sh verify "$SHA" --creator "$CREATOR"

      - name: Images must be pinned by digest
        run: |
          case "$BACKEND_IMAGE $FRONTEND_IMAGE" in
            *@sha256:*@sha256:*) echo "backend  $BACKEND_IMAGE"; echo "frontend $FRONTEND_IMAGE" ;;
            *) echo "::error::missing image digest"; exit 1 ;;
          esac

      # Recorded through the REST API rather than a job `environment:` key, which would
      # change the OIDC subject and break the federated credential.
      - name: Record deployment (GitHub Deployments API)
        id: record
        run: |
          id=$(jq -n --arg ref "$SHA" \
                 '{ref: $ref, environment: "azure", auto_merge: false, required_contexts: [],
                   description: "CD deploy to Azure Container Apps"}' \
               | gh api -X POST "repos/$REPO/deployments" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=in_progress > /dev/null

      - name: Azure login (OIDC federated credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new images to the Container Apps (by digest)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_BACKEND_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "ghcr.io/${{ github.repository }}-backend@${{ needs.images.outputs.backend_digest }}"
            az containerapp update \
              --name "${{ vars.AZURE_FRONTEND_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "ghcr.io/${{ github.repository }}-frontend@${{ needs.images.outputs.frontend_digest }}"

      # X1 / T11.2.11: the purge and backup Jobs follow the deployed digest (jobs image), after
      # the apps. `job update --image` only — never per-execution overrides, never schedules.
      - name: Update the purge and backup Job images (by digest)
        env:
          JOBS_IMAGE: ghcr.io/${{ github.repository }}-jobs@${{ needs.images.outputs.jobs_digest }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PURGE_JOB: ${{ vars.AZURE_PURGE_JOB }}
          BACKUP_JOB: ${{ vars.AZURE_BACKUP_JOB }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          for job in "$PURGE_JOB" "$BACKUP_JOB"; do
            bash scripts/cd/azure_jobs.sh update-image --rg "$RESOURCE_GROUP" --job "$job" --image "$JOBS_IMAGE"
          done

      - name: Record deployment status
        if: always() && steps.record.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api -X POST "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$STATE" > /dev/null
