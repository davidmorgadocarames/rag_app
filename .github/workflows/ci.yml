name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests incl. DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres + pgvector for the DB tests (T11.0.8). Published on 15432, like the local gate
    # project: the test DB harness refuses 5432 (the development port) by design.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: secrag_ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: secrag_ci
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U secrag_ci -d secrag_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Harness maintenance connection; each run creates and drops its own test database.
      TEST_DATABASE_URL: postgresql+psycopg://secrag_ci:ci-throwaway@localhost:15432/postgres
      # DB tests must execute in CI: a missing TEST_DATABASE_URL fails instead of skipping.
      SECRAG_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Alembic upgrade head (CI Postgres)
        env:
          DATABASE_URL: postgresql+psycopg://secrag_ci:ci-throwaway@localhost:15432/secrag_ci
        run: alembic upgrade head && alembic current
      - name: Pytest (unit)
        run: pytest -rs -m "not db"
      - name: Pytest (DB tests through the harness — must run, never skip)
        run: pytest -rs -m db
      - name: Links (adr-links) and eval data (schema-check)
        env:
          PYTHONPATH: src
        run: |
          python -m rag_app.devtools.adr_links --root ..
          python -m rag_app.devtools.schema_check --root ..

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm 11 (engines; same as WSL and the Dockerfile)
        run: npm install -g npm@11.20.0 && node --version && npm --version
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Server-side backstop for the local pre-push gate (DA-B-1, DA-B-5, D-2026-09-27-7 a):
  # the same gate.sh steps, so a push that skipped the hook still shows these results.
  # Under --only a missing tool fails (never skips). Hook activation is local-only.
  cheap-checks:
    name: Gate cheap checks (git modes, shellcheck, venv, dependency-audit, adr-links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm 11 (same as WSL and the Dockerfile)
        run: npm install -g npm@11.20.0
      - name: Backend venv (CPU torch as in backend/Dockerfile, then the pins)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          backend/.venv/bin/pip install --quiet -r backend/requirements-dev.txt
      - name: Frontend dependencies (npm audit needs the lock tree)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Tool versions
        run: shellcheck --version && node --version && npm --version
      - name: gate.sh --only git-modes,shellcheck,venv,dependency-audit,adr-links
        env:
          GATE_VENV: ${{ github.workspace }}/backend/.venv
        run: bash scripts/gate.sh --only git-modes,shellcheck,venv,dependency-audit,adr-links
