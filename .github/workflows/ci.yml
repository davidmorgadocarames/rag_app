name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests incl. DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres + pgvector for the DB tests (T11.0.8). Published on 15432, like the local gate
    # project: the test DB harness refuses 5432 (the development port) by design.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: secrag_ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: secrag_ci
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U secrag_ci -d secrag_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Harness maintenance connection; each run creates and drops its own test database.
      TEST_DATABASE_URL: postgresql+psycopg://secrag_ci:ci-throwaway@localhost:15432/postgres
      # DB tests must execute in CI: a missing TEST_DATABASE_URL fails instead of skipping.
      SECRAG_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (pinned CPU torch first, as in backend/Dockerfile)
        run: |
          pip install -r requirements-torch.txt
          pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      # Roles before migrate, as in compose, the gate and Azure (T11.0.13). Applied twice
      # (idempotent); throwaway CI passwords; each role must then log in.
      - name: Database roles (db/roles.sql, twice) + role logins
        env:
          DATABASE_URL: postgresql://secrag_ci:ci-throwaway@localhost:15432/secrag_ci
          SECRAG_PURGER_PASSWORD: ci-throwaway-purger
          SECRAG_BACKUP_PASSWORD: ci-throwaway-backup
        run: |
          psql --version
          bash ../scripts/db/apply_roles.sh
          bash ../scripts/db/apply_roles.sh
          PGPASSWORD="$SECRAG_PURGER_PASSWORD" psql -X -tA "postgresql://secrag_purger@localhost:15432/secrag_ci" -c 'SELECT current_user'
          PGPASSWORD="$SECRAG_BACKUP_PASSWORD" psql -X -tA "postgresql://secrag_backup@localhost:15432/secrag_ci" -c 'SELECT current_user'
      # migrations-roundtrip (T11.2.9): fresh DB → roles.sql (above) → upgrade head →
      # downgrade -1 → upgrade head, as the gate step does; a broken downgrade fails here.
      - name: Alembic round trip (upgrade head → downgrade -1 → upgrade head)
        env:
          DATABASE_URL: postgresql+psycopg://secrag_ci:ci-throwaway@localhost:15432/secrag_ci
        run: |
          alembic upgrade head && alembic current
          alembic downgrade -1 && alembic current
          alembic upgrade head && alembic current
      - name: Pytest (unit)
        run: pytest -rs -m "not db"
      - name: Pytest (DB tests through the harness — must run, never skip)
        run: pytest -rs -m db
      - name: Links (adr-links) and eval data (schema-check)
        env:
          PYTHONPATH: src
        run: |
          python -m rag_app.devtools.adr_links --root ..
          python -m rag_app.devtools.schema_check --root ..

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm 11 (engines; same as WSL and the Dockerfile)
        run: npm install -g npm@11.20.0 && node --version && npm --version
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # SSE consumer (T11.2.16): node --test with type stripping (Node >= 22.18).
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # Slim jobs image (T11.2.12): the migration/purge/backup Jobs run it. rag_app must import
  # without torch, which must not be importable at all.
  jobs-image:
    name: Jobs image (build, no torch, pg_dump 16, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend/Dockerfile.jobs
        run: docker build --build-context dbscripts=scripts/db -f backend/Dockerfile.jobs -t secrag-jobs:ci backend
      - name: rag_app.erasure imports; torch is not importable
        run: |
          docker run --rm secrag-jobs:ci python -c 'import rag_app.erasure, rag_app.keycheck, azure.storage.blob, azure.identity; print("imports ok")'
          if docker run --rm secrag-jobs:ci python -c 'import torch' 2>/dev/null; then
            echo "::error::torch is importable in the jobs image"
            exit 1
          fi
          echo "torch not importable: ok"
      - name: Tools (pg_dump 16, age, alembic, non-root)
        run: |
          docker run --rm secrag-jobs:ci sh -c 'pg_dump --version | grep -q "(PostgreSQL) 16\." && age --version && alembic --help >/dev/null && test "$(id -u)" = 10001'
      - name: Backup Job pieces (T11.2.10; retention from rag_app/retention.py)
        run: |
          days="$(docker run --rm secrag-jobs:ci bash /app/scripts/db/backup.sh --retention-days)"
          want="$(sed -n 's/^BACKUP_RETENTION_DAYS = \([0-9]*\)$/\1/p' backend/src/rag_app/retention.py)"
          test -n "$want" && test "$days" = "$want"
          echo "backup.sh in the image: retention $days days"
          docker run --rm secrag-jobs:ci python -c 'import rag_app.backup_blob, rag_app.tombstones; print("backup modules ok")'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the jobs pins (pip-audit, pinned version from requirements-dev.txt)
        run: |
          pip install "$(grep -E '^pip-audit==' backend/requirements-dev.txt)"
          pip-audit --no-deps --disable-pip -r backend/requirements-jobs.txt

  # Backend image (T11.4.2): the cross-encoder reranker is baked into the image's Hugging
  # Face cache at build time (pinned revision, config.py), HF_HUB_OFFLINE=1 set after — so a
  # cold container reranks with NO network at all, even on a first-ever start. `--network
  # none` on a throwaway container is the actual proof, not just "the model imports".
  #
  # DA-11bC-1: built through buildx with the GitHub Actions cache (`type=gha`, no secrets —
  # it is a cache, not a registry) so a re-run or a PR-sync build reuses layers, incl. the
  # baked model layer when neither the pinned revision nor the two files it depends on
  # changed (backend/Dockerfile's own ordering is what makes that layer cacheable at all —
  # see test_backend_image.py).
  backend-image:
    name: Backend image (build, reranker baked in, offline rerank)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          tags: secrag-backend:ci
          load: true
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
      - name: HF_HUB_OFFLINE is set in the image
        run: |
          docker run --rm secrag-backend:ci python -c \
            'import os; assert os.environ.get("HF_HUB_OFFLINE") == "1"; print("HF_HUB_OFFLINE=1 ok")'
      - name: Reranks with networking disabled (throwaway container, no volumes)
        run: |
          docker run --rm --network none secrag-backend:ci python -c '
          from rag_app.reranking import CrossEncoderReranker
          from rag_app.retrieval import RetrievedChunk
          r = CrossEncoderReranker()
          r.warm_up()
          chunks = [RetrievedChunk(chunk_uid="a::0", heading="h",
                                    text="Use prepared statements to prevent SQL injection.",
                                    version="2021", effective_date=None, score=0.0)]
          out = r.rerank("How do I prevent SQL injection?", chunks, top_n=1)
          assert out and isinstance(out[0].score, float)
          print("offline rerank ok, score=", out[0].score)
          '
      - name: A model NOT baked into the image still fails offline (the guard is real)
        run: |
          if docker run --rm --network none secrag-backend:ci python -c '
          from rag_app.reranking import load_cross_encoder
          load_cross_encoder("someone/not-baked-model", "a" * 40)
          ' 2>/dev/null; then
            echo "::error::an uncached model unexpectedly loaded offline"
            exit 1
          fi
          echo "uncached model correctly refused offline: ok"
      - name: Image size (informational; ADR records a local before/after)
        run: docker images secrag-backend:ci --format "{{.Size}}"

  # Custom Ollama image (T11.4.3): `bge-m3` baked in at build time (fixes the Azure
  # `secrag-ollama` ephemeral-storage loss — ADR phase 11, runbook gotcha 4). Measured
  # locally: ~6.3 GB on-disk (`du`), build ~40s (base image layers cached after the first
  # pull); fits a GH-hosted runner's disk/time budget the same way backend-image (~3.9 GB)
  # already does — `df -h` below records the real runner numbers for the record.
  ollama-image:
    name: Ollama image (build, bge-m3 baked in, offline embed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Disk space before the build (informational)
        run: df -h /
      - name: Build ollama/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: ollama
          file: ollama/Dockerfile
          tags: secrag-ollama:ci
          load: true
          cache-from: type=gha,scope=ollama-image
          cache-to: type=gha,mode=max,scope=ollama-image
      - name: bge-m3 is already pulled (ollama list, no server needed)
        run: |
          docker run --rm --entrypoint ollama secrag-ollama:ci list | grep -q bge-m3
      - name: Embeds with networking disabled (throwaway container, no volumes)
        run: |
          docker rm -f secrag-ollama-ci-embed 2>/dev/null || true
          docker run -d --name secrag-ollama-ci-embed --network none secrag-ollama:ci
          for _ in $(seq 1 30); do
            docker exec secrag-ollama-ci-embed ollama list >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec secrag-ollama-ci-embed bash -c '
          body="{\"model\":\"bge-m3\",\"input\":\"hello world\"}"
          len=${#body}
          exec 3<>/dev/tcp/127.0.0.1/11434
          printf "POST /api/embed HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s" "$len" "$body" >&3
          response="$(cat <&3)"
          echo "$response" | grep -q "\"embeddings\":\[\[" || { echo "::error::no embeddings in the response"; echo "$response"; exit 1; }
          echo "offline embed ok"
          '
          docker rm -f secrag-ollama-ci-embed
      - name: Image size (informational; ADR records a local before/after) and disk space after
        run: |
          docker images secrag-ollama:ci --format "{{.Size}}"
          df -h /

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Server-side backstop for the local pre-push gate (DA-B-1, DA-B-5, D-2026-09-27-7 a):
  # the same gate.sh steps, so a push that skipped the hook still shows these results.
  # Under --only a missing tool fails (never skips). Hook activation is local-only.
  cheap-checks:
    name: Gate cheap checks (git modes, shellcheck, venv, dependency-audit, adr-links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm 11 (same as WSL and the Dockerfile)
        run: npm install -g npm@11.20.0
      - name: Backend venv (CPU torch as in backend/Dockerfile, then the pins)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --quiet -r backend/requirements-torch.txt
          backend/.venv/bin/pip install --quiet -r backend/requirements-dev.txt
      - name: Frontend dependencies (npm audit needs the lock tree)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # The runner's apt shellcheck (0.9.x) flags cases the local 0.11.0 accepts, so a local
      # PASS did not guarantee CI's (F-2026-09-29-1, DA-C-7). Same version and SHA-256 as
      # scripts/prereqs/install.sh (a unit test keeps them equal); put first on PATH.
      - name: shellcheck (pinned, checksum-verified)
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          tarball="shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shellcheck"
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/shellcheck" --strip-components=1
          "$RUNNER_TEMP/shellcheck/shellcheck" --version | grep -qx "version: $SHELLCHECK_VERSION"
          echo "$RUNNER_TEMP/shellcheck" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          shellcheck --version | grep -x "version: 0.11.0"
          node --version && npm --version
      - name: gate.sh --only git-modes,shellcheck,venv,dependency-audit,adr-links
        env:
          GATE_VENV: ${{ github.workspace }}/backend/.venv
        run: bash scripts/gate.sh --only git-modes,shellcheck,venv,dependency-audit,adr-links
