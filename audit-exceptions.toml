# Dependency-audit exceptions (T11.0.7). Read by scripts/gate.sh step dependency-audit
# (rag_app.devtools.dependency_audit) and the CI job "cheap-checks". One [[exception]] per
# advisory:
#   advisory  id reported by the tool (or one of its aliases: GHSA-/CVE-/PYSEC-)
#   package   affected package; ecosystem: pypi | npm
#   reason    why it is accepted: how (or whether) the vulnerable code is reachable in
#             SecRAG, and what removes the entry
#   expires   TOML date; a past date FAILS the gate (review, fix or re-justify)
# An unlisted advisory fails the gate; a duplicated (ecosystem, package, advisory) is invalid.
# Keep entries sorted by ecosystem/package.
#
# Expiry policy (D-2026-09-27-6):
# - INTERIM entries expire with the block that fixes them. starlette (via FastAPI) and
#   transformers (via sentence-transformers) are fixed by PHASE_TASKS row 37d (deps block,
#   before row 38). 2026-10-31 is the expected 11a promotion window: row 37d precedes the
#   full gate (row 38) and the promotion (rows 40/41). If 11a slips past it, every push fails
#   and the entries must be re-decided, not silently carried over.
# - PERMANENT entries (no fixed version, or no fixed version in every record) carry a
#   re-review date six months out.
# - cryptography, PyJWT, pytest and setuptools were bumped in the block B fix block (D-6 a1).

