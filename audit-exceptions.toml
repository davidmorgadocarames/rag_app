# Dependency-audit exceptions (T11.0.7). Read by scripts/gate.sh step dependency-audit
# (rag_app.devtools.dependency_audit) and the CI job "cheap-checks". One [[exception]] per
# advisory:
#   advisory  id reported by the tool (or one of its aliases: GHSA-/CVE-/PYSEC-)
#   package   affected package; ecosystem: pypi | npm
#   reason    why it is accepted: how (or whether) the vulnerable code is reachable in
#             SecRAG, and what removes the entry
#   expires   TOML date; a past date FAILS the gate (review, fix or re-justify)
# An unlisted advisory fails the gate; a duplicated (ecosystem, package, advisory) is invalid.
# Keep entries sorted by ecosystem/package.
#
# Expiry policy (D-2026-09-27-6):
# - INTERIM entries expire with the block that fixes them. None are left: cryptography, PyJWT,
#   pytest and setuptools were bumped in the block B fix block (D-6 a1); FastAPI/starlette
#   (0.142.2 / 1.7.0) and sentence-transformers/transformers (6.1.0 / 5.17.0) in the deps
#   block, PHASE_TASKS row 37d (D-6 a2). The two formerly PERMANENT transformers entries
#   (PYSEC-2025-217, PYSEC-2026-2290) are no longer reported for 5.17.0 and were removed.
# - PERMANENT entries (no fixed version, or no fixed version in every record) carry a
#   reachability reason and a re-review date six months out.

[[exception]]
advisory = "GHSA-6g55-p6wh-862q"
package = "postcss"
ecosystem = "npm"
reason = "postcss bundled inside next (not a direct dependency; the fix needs a major Next upgrade). Not reachable at runtime: build-time CSS processing of our own styles only, no user-supplied CSS. Accepted until Phase 15 (supply chain); the date is a backstop."
expires = 2027-06-30

