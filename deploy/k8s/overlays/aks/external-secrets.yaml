# AKS overlay secret sourcing (T16.1.3): External Secrets Operator reading Azure Key Vault,
# instead of the local overlay's SealedSecrets -- RENDERED/VALIDATED ONLY, nothing here is ever
# applied to a real cluster (no AKS cluster or Key Vault exists; `<...>` placeholders are never
# filled in by this phase, same convention as deploy/azure/jobs/*.yaml's own <angle-bracket>
# placeholders). Produces Secrets with the SAME names/keys the local overlay's SealedSecrets
# produce (app-secrets, secrag-db-credentials), so deploy/k8s/base's Deployments/Jobs need no
# per-overlay change to consume them.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-keyvault
  namespace: secrag
spec:
  provider:
    azurekv:
      vaultUrl: "https://<key-vault-name>.vault.azure.net"
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: secrag
spec:
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: app-secrets
  refreshInterval: 1h
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: secrag-jwt-secret
    - secretKey: CSRF_SECRET
      remoteRef:
        key: secrag-csrf-secret
    - secretKey: LOCKOUT_HMAC_SECRET
      remoteRef:
        key: secrag-lockout-hmac-secret
    - secretKey: CLIENT_IP_HMAC_KEYS
      remoteRef:
        key: secrag-client-ip-hmac-keys
    - secretKey: DATA_MASTER_KEY
      remoteRef:
        key: secrag-data-master-key
    - secretKey: SECRAG_PURGER_PASSWORD
      remoteRef:
        key: secrag-purger-password
    - secretKey: SECRAG_BACKUP_PASSWORD
      remoteRef:
        key: secrag-backup-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrag-db-credentials
  namespace: secrag
spec:
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: secrag-db-credentials
  refreshInterval: 1h
  data:
    - secretKey: username
      remoteRef:
        key: secrag-db-username
    - secretKey: password
      remoteRef:
        key: secrag-db-password
    - secretKey: database-url
      remoteRef:
        key: secrag-db-url
