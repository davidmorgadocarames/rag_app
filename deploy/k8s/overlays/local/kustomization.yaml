# Local overlay (T16.1.2): applied for real against the k3d cluster. ENV=dev everywhere (the
# base's own ConfigMaps default to ENV=prod -- Jobs/apps fail closed by default, same rule as
# .env.example's ENV comment). Secret-producing resources are SealedSecrets (T16.1.3,
# sealed-secrets.yaml), decrypted only by the in-cluster controller.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - sealed-secrets.yaml
patches:
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: replace
        path: /data/ENV
        value: dev
  - target:
      kind: ConfigMap
      name: jobs-config
    patch: |-
      - op: replace
        path: /data/ENV
        value: dev
