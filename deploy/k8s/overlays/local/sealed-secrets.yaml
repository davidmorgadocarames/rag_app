# App secrets, sealed in git (T16.1.3). Generated with kubeseal against THIS repo's own live
# k3d cluster (the Sealed Secrets controller cluster-up.sh installs) and committed as the
# encrypted SealedSecret below -- the `encryptedData` values can only be decrypted by that
# controller's private key, which never leaves the cluster (and is backed up/restored outside
# git via scripts/k8s/sealed-secrets-key.sh, T16.0.3, age-encrypted). Every underlying plaintext
# value is a disposable, randomly generated, local-development-only value with no meaning
# outside this k3d cluster (openssl rand -hex 32 for the HMAC secrets, a fresh Fernet key for
# DATA_MASTER_KEY) -- never printed to a file, never reused anywhere else, and not a "real"
# secret in the sense the project's hard rules mean (DB passwords/API keys for an actual
# environment). Re-sealing after a `cluster-down.sh && cluster-up.sh` cycle is only needed if the
# Sealed Secrets key itself was not restored via SEALED_SECRETS_AGE_IDENTITY (a fresh controller
# key cannot decrypt ciphertext sealed under the old one).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secrets
  namespace: secrag
spec:
  encryptedData:
    CLIENT_IP_HMAC_KEYS: 
    CSRF_SECRET: 
    DATA_MASTER_KEY: 
    JWT_SECRET: 
    LOCKOUT_HMAC_SECRET: 
    SECRAG_BACKUP_PASSWORD: 
    SECRAG_PURGER_DATABASE_URL: 
    SECRAG_PURGER_PASSWORD: 
  template:
    metadata:
      name: app-secrets
      namespace: secrag
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: secrag-db-credentials
  namespace: secrag
spec:
  encryptedData:
    database-url: 
    password: 
    username: 
  template:
    metadata:
      name: secrag-db-credentials
      namespace: secrag
---
# SeaweedFS S3 access key/secret pair (T16.1.5). Same disposable-dev-value convention as above;
# referenced by cnpg/cluster.yaml's Barman Cloud s3Credentials AND by seaweedfs-s3-config below
# (the SAME key pair, so CNPG's S3 client and SeaweedFS's own identity file agree).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: seaweedfs-credentials
  namespace: secrag
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: seaweedfs-credentials
      namespace: secrag
---
# SeaweedFS's own S3-gateway identity file (same access/secret key pair as above, JSON shape
# weed's -s3.config flag expects).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: seaweedfs-s3-config
  namespace: secrag
spec:
  encryptedData:
    s3_config.json: 
  template:
    metadata:
      name: seaweedfs-s3-config
      namespace: secrag
---
# Valkey AUTH password (T16.1.5/D16.3's "password" requirement; LimiterStore wiring itself is
# T16.3, block 16-D -- this just gives Valkey a credential from day one, never unauthenticated).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: valkey-credentials
  namespace: secrag
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: valkey-credentials
      namespace: secrag
