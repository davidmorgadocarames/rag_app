# PodDisruptionBudget (T16.2.3): same reasoning as backend/pdb.yaml -- `minAvailable: 1` blocks
# any voluntary disruption of the frontend's sole replica (today `disruptionsAllowed: 0`
# unconditionally). Same forward-looking boundary for 16-D once replicas > 1, same
# `pdb-min-available` self-reported annotation and `unhealthyPodEvictionPolicy: AlwaysAllow` fix.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: secrag
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: secrag
  annotations:
    ignore-check.kube-linter.io/pdb-min-available: "replicas:1 forces minAvailable>=replicas by design (zero-downtime boundary, see backend/pdb.yaml); re-check at 16-D (T16.3.1) once replicas > 1"
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
