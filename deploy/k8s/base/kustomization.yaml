# Phase 16 Kustomize base (T16.1.1). Folds in T16.0's namespace + ollama-access bases (ADR
# "16-A" section already said this directory would do so) and adds the application components.
# Grown incrementally by T16.1.3 (secrets), T16.1.4 (cnpg), T16.1.5 (services) -- see each
# subdirectory's own kustomization.yaml and comments.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# BUG FOUND BY THE CLUSTER SMOKE (16-B): a generated resource (jobs/kustomization.yaml's
# roles-scripts configMapGenerator) has no `metadata.namespace` of its own (configMapGenerator
# never sets one) -- it silently landed in the `default` namespace on `kubectl apply`, not
# `secrag`, with NO error (`kubectl apply` happily creates a cluster-scoped-looking object
# wherever the current context's default namespace is). `namespace:` here applies Kustomize's
# namespace transformer to EVERY resource in this base (hand-written ones already say
# `namespace: secrag` explicitly, so this is a no-op for them; it is NOT a no-op for any
# existing or future generated resource).
namespace: secrag
resources:
  - namespace.yaml
  - ollama
  - backend
  - frontend
  - jobs
  - gateway
  - cnpg
  - services
