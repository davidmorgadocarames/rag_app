# Backend Deployment (T16.1.1). No HPA here (KEDA owns scaling from T16.3, TF37) -- a plain,
# fixed-replica Deployment. Image is a PLACEHOLDER (same X1 pattern as deploy/azure/jobs/*.yaml):
# a local image build/push step (not yet written -- T16.1.7/16.2) or CD-by-digest on a future
# Azure path sets the real tag/digest. F20 fix, 16-B-fix: scripts/k8s/deploy-local.sh does NOT
# build or push images -- it only applies this Deployment (and waits for the migrate Job to
# Complete first, fail-closed); until a real tag/digest exists, this file's own placeholder
# pods never start (ErrImagePull/ImagePullBackOff, X1 convention), which is expected, not a bug.
#
# Probes (T16.2.1): startup is GENEROUS on /health (the lifespan itself already blocks
# Uvicorn from accepting any connection, including this probe, until the DB check +
# reranker warm-up both succeed -- see rag_app.api.app.lifespan -- so a slow CPU-only model
# load never fails startup early; failureThreshold*periodSeconds = 300s). Readiness hits
# /health/ready (checks Postgres on every call -- a DB outage pulls the pod out of the
# Service WITHOUT restarting it). Liveness hits /health (process only, NEVER touches the
# DB -- a transient DB outage must never trigger a restart storm across every replica).
# Rolling-update strategy, preStop and PDBs are T16.2.3 (block 16-D/later), not this row.
#
# securityContext is deliberately partial: allowPrivilegeEscalation/capabilities are safe to set
# unconditionally, but `runAsNonRoot: true` is NOT set here because backend/Dockerfile does not
# yet declare a non-root USER (unlike Dockerfile.jobs's USER 10001) -- setting it now would make
# every backend pod CrashLoop. KNOWN BOUNDARY (self-reported, see the ADR): T16.4 (block 16-E,
# Pod Security `restricted` on the app namespace) needs a non-root backend image; until then this
# namespace cannot yet carry the `restricted` PSA label without breaking this Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: secrag
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: secrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: secrag
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: secrag-registry:5050/secrag/backend:placeholder
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: app-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secrag-db-credentials
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
