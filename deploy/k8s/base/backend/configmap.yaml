# Backend non-secret configuration (T16.1.1). Mirrors docker-compose.yml's backend service env
# block, minus every value that is a credential/secret (those are in the `app-secrets`
# SealedSecret, deploy/k8s/overlays/local/sealed-secrets.yaml -- T16.1.3 -- consumed via
# envFrom secretRef; F20 fix, 16-B-fix: the path above never existed).
#
# OLLAMA_HOST points at the selector-less Service from T16.0.4 (base/ollama) -- the SAME native
# WSL/host Ollama the compose stack reaches, never a containerised one (D16.1).
#
# FRONTEND_ORIGIN / PUBLIC_APP_URL use the Gateway's hostname (base/gateway/gateway.yaml,
# "secrag.localtest.me" -- a public wildcard DNS name that resolves to 127.0.0.1, the usual
# convention for local k8s HTTP testing), not the in-cluster Service DNS name: both values are
# compared against the browser's Origin/Host header, which is the externally-visible hostname,
# never a cluster-internal one. KNOWN BOUNDARY (self-reported, see the ADR): cluster-up.sh does
# not map a host port to the Gateway's LoadBalancer Service yet (no `-p` flag at `k3d cluster
# create` time) -- this block's own cluster smoke test reaches the Gateway via `kubectl
# port-forward` + a spoofed Host header, which does not need a mapped port. Real interactive
# browser access additionally needs `-p "<port>:80@loadbalancer"` added to cluster-up.sh (left
# for a later block/developer need, not required by any T16.1 Done-when).
#
# OMP_NUM_THREADS / MKL_NUM_THREADS (T16.2.2, self-reported finding): the running app (unlike
# rag_app.eval.latency's own measurement harness) never pinned torch's thread pool -- a k8s CPU
# `limit` is a CFS quota, not a cpuset, so without this torch's intra-op thread pool sizes
# itself from the node's FULL core count (via sched_getaffinity), not the pod's quota, which
# throttles hard once more threads are runnable than the quota allows (confirmed by this
# block's own burst measurement: ~105% CPU during a 50-worker /health/ready burst on an
# unthrottled host -- a tighter quota without this pin would contend far worse). Pinned to "2"
# to match the backend Deployment's own `resources.limits.cpu: 2000m` below (Azure parity --
# `secrag-backend` is already provisioned at cpu 2 / mem 4Gi) and `rerank_concurrency`'s
# existing design ("same 2 vCPUs", ADR phase11_stability decision 8/T11.5.1b).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: secrag
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: secrag
data:
  ENV: "prod"
  OLLAMA_HOST: "http://ollama-host.secrag.svc.cluster.local:11434"
  DAILY_ANSWER_CAP: "1000"
  FRONTEND_ORIGIN: "http://secrag.localtest.me"
  METRICS_PORT: "9100"
  PROMETHEUS_URL: "http://prometheus.secrag.svc.cluster.local:9090"
  ADMIN_LIVE_MODE: "sse"
  SMTP_HOST: "mailpit.secrag.svc.cluster.local"
  SMTP_PORT: "1025"
  PUBLIC_APP_URL: "http://secrag.localtest.me"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
