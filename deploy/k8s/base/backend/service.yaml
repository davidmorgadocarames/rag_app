apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: secrag
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: secrag
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
