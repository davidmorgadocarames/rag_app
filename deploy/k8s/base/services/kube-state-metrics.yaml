# kube-state-metrics (T16.1.5, PHASE_PLANNING 16.1 "Prometheus + kube-state-metrics"). Read-only
# cluster-wide RBAC is unavoidable for this exporter (it reports the STATE of every workload,
# not just this namespace's own) -- scoped to exactly the resource kinds it exports metrics for
# (verbs: get/list/watch only, never write). Image pinned by digest (X1).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: secrag
  labels:
    app.kubernetes.io/part-of: secrag
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrag-kube-state-metrics
  labels:
    app.kubernetes.io/part-of: secrag
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "resourcequotas", "replicationcontrollers",
                "limitranges", "persistentvolumeclaims", "persistentvolumes", "namespaces",
                "endpoints"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrag-kube-state-metrics
  labels:
    app.kubernetes.io/part-of: secrag
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrag-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: secrag
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: secrag
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: secrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: secrag
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # The upstream image's USER is "nobody" (non-numeric) -- the kubelet cannot verify
            # runAsNonRoot from a non-numeric image user alone (confirmed live: "cannot verify
            # user is non-root"), so the numeric UID is pinned explicitly (65534 = nobody on
            # this image, confirmed by inspecting the image's /etc/passwd).
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: secrag
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: secrag
spec:
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
