# In-cluster Prometheus (T16.1.5) -- same pinned digest as docker-compose.yml's own prometheus
# service (T11.3.3), scraping the backend's internal metrics port (never the API port, TF4) AND
# kube-state-metrics (new in-cluster target). 7-day retention, matching compose. No persistent
# volume (emptyDir): this is throwaway monitoring data, not the protected CNPG database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: secrag
  labels:
    app.kubernetes.io/part-of: secrag
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: secrag-backend
        static_configs:
          - targets: ["backend.secrag.svc.cluster.local:9100"]
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.secrag.svc.cluster.local:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: secrag
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: secrag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: secrag
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: secrag
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: secrag
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
