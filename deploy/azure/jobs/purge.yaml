# Azure Container Apps Job: batched erasure purger (11.2b, T11.2b.4/6). AUTHORED HERE, APPLIED
# BY HAND (runbook, row 40) as a SCHEDULE Job with a DORMANT cron (`0 0 1 1 *`: 00:00 UTC on
# 1 January only); right after the promotion's CD run and its health gate (row 41) only the
# cron is switched to hourly by hand (D-2026-10-01-5 — az 2.90 `job update` cannot change a
# trigger type, only the cron of a Schedule Job). CD never applies Job YAML and never changes
# triggers or schedules (X1). `az containerapp job start` runs it on demand at any time.
#
#   az containerapp job create -g rg-secrag -n <AZURE_PURGE_JOB> --yaml deploy/azure/jobs/purge.yaml
#   az containerapp job secret set ...   # by the OWNER, URL read with `read -rs` (runbook)
#   az containerapp job update -g rg-secrag -n <AZURE_PURGE_JOB> --image <deployed jobs digest>
#   az containerapp job update -g rg-secrag -n <AZURE_PURGE_JOB> --cron-expression "0 * * * *"
#
# - Image: PLACEHOLDER (CD updates it to the deployed jobs digest after the apps, X1).
# - Runs as the least-privilege role `secrag_purger` (grants from migration 0005), never the
#   owner: `python -m rag_app.erasure purge` (batched, resumable, advisory lock — an
#   overlapping run is skipped; stops claiming work after 1500 s, below replicaTimeout).
# - The user-assigned identity writes the tombstone export to Blob `tombstones/` (R5-2) in
#   the container BACKUP_CONTAINER and prunes exports older than 30 days (newest kept;
#   DA-F-8) — Storage Blob Data Contributor. Exit 1 = a request failed or an export name needs
#   a look (the WARNING line in the Job log).
# - Secret value: placeholder, set with `job secret set`; never re-apply to an existing Job.
location: <region-of-the-container-apps-environment>
identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/<subscription-id>/resourceGroups/rg-secrag/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<jobs-identity>: {}
properties:
  environmentId: /subscriptions/<subscription-id>/resourceGroups/rg-secrag/providers/Microsoft.App/managedEnvironments/<environment-name>
  configuration:
    triggerType: Schedule
    scheduleTriggerConfig:
      cronExpression: "0 0 1 1 *"   # dormant until the post-CD switch to "0 * * * *"
      parallelism: 1
      replicaCompletionCount: 1
    replicaTimeout: 1800
    replicaRetryLimit: 1          # resumable: the next run completes what a killed one left
    secrets:
      - name: database-url
        value: <set-with-az-containerapp-job-secret-set>
  template:
    containers:
      - name: purge
        image: mcr.microsoft.com/k8se/quickstart-jobs:latest   # placeholder; CD sets the digest
        command: ["python", "-m", "rag_app.erasure", "purge"]
        env:
          - name: DATABASE_URL
            secretRef: database-url
          - name: ENV
            value: prod
          - name: AZURE_CLIENT_ID
            value: <client-id-of-the-jobs-identity>
          - name: TOMBSTONE_STORAGE_ACCOUNT
            value: <storage-account-name>
          - name: BACKUP_CONTAINER
            value: secrag-backups
        resources:
          cpu: 0.25
          memory: 0.5Gi
