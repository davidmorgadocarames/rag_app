# Azure Container Apps Job: encrypted database backup to Blob (T11.2.10, block F). AUTHORED
# HERE, APPLIED BY HAND (runbook, row 40) as a SCHEDULE Job with a DORMANT cron (`0 0 1 1 *`:
# 00:00 UTC on 1 January only); right after the promotion's CD run and its health gate (row 41)
# only the cron is switched to daily by hand (D-2026-10-01-5 — az 2.90 `job update` cannot
# change a trigger type, only the cron of a Schedule Job). CD never applies Job YAML and never
# changes triggers or schedules (X1). `az containerapp job start` runs it on demand at any time.
#
#   az containerapp job create -g rg-secrag -n <AZURE_BACKUP_JOB> --yaml deploy/azure/jobs/backup.yaml
#   az containerapp job secret set ...   # by the OWNER, URL read with `read -rs` (runbook)
#   az containerapp job update -g rg-secrag -n <AZURE_BACKUP_JOB> --image <deployed jobs digest>
#   az containerapp job update -g rg-secrag -n <AZURE_BACKUP_JOB> --cron-expression "0 3 * * *"
#
# - Image: PLACEHOLDER (CD updates it to the deployed jobs digest after the apps, X1).
# - Runs as the read-only role `secrag_backup`; `pg_dump` 16 → `age` (PUBLIC key only; the
#   private key never reaches Azure, R4-1) → Blob `backups/secrag-<ts>.dump.age` with the
#   user-assigned identity (Storage Blob Data Contributor; shared-key access disabled), then
#   the oldest-blob check (fails when a backup blob is older than the 14-day promise, X9 —
#   the lifecycle rule deletes `backups/` after 12 days). Script: scripts/db/backup.sh.
# - Secret value: placeholder, set with `job secret set`; never re-apply to an existing Job.
location: <region-of-the-container-apps-environment>
identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/<subscription-id>/resourceGroups/rg-secrag/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<jobs-identity>: {}
properties:
  environmentId: /subscriptions/<subscription-id>/resourceGroups/rg-secrag/providers/Microsoft.App/managedEnvironments/<environment-name>
  configuration:
    triggerType: Schedule
    scheduleTriggerConfig:
      cronExpression: "0 0 1 1 *"   # dormant until the post-CD switch to "0 3 * * *"
      parallelism: 1
      replicaCompletionCount: 1
    replicaTimeout: 1800
    replicaRetryLimit: 1
    secrets:
      - name: database-url
        value: <set-with-az-containerapp-job-secret-set>
  template:
    containers:
      - name: backup
        image: mcr.microsoft.com/k8se/quickstart-jobs:latest   # placeholder; CD sets the digest
        command: ["bash", "/app/scripts/db/backup.sh", "--blob"]
        env:
          - name: DATABASE_URL
            secretRef: database-url
          - name: ENV
            value: prod
          - name: AZURE_CLIENT_ID
            value: <client-id-of-the-jobs-identity>
          - name: BACKUP_STORAGE_ACCOUNT
            value: <storage-account-name>
          - name: BACKUP_CONTAINER
            value: secrag-backups
          - name: BACKUP_AGE_RECIPIENT
            value: <age-public-key>
        resources:
          cpu: 0.5
          memory: 1Gi
