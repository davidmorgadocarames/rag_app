[project]
name = "rag-app-backend"
version = "0.1.0"
description = "SecRAG backend — agentic RAG assistant for OWASP security guidance"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, flake8-comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["rag_app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
