[project]
name = "rag-app-backend"
version = "0.1.0"
description = "SecRAG backend — agentic RAG assistant for OWASP security guidance"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, flake8-comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
# Analyze as 3.12 so numpy 2.x's 3.12-syntax stubs parse; runtime target is 3.11+.
python_version = "3.12"
mypy_path = "src"
packages = ["rag_app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pymupdf4llm", "pymupdf", "pgvector.*", "sentence_transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
