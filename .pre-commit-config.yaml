# Pre-commit hooks: run automatically before every commit.
# Install once with: pre-commit install
# Run on demand with: pre-commit run --all-files
repos:
  # --- General hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-json

  # --- Python: lint + format (backend) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # --- Secret scanning: blocks committing .env / keys / tokens ---
  # Same gitleaks version as CI's gitleaks-action (8.24.3 on 2026-09-28).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
      # Gate step `gitleaks` (manual stage): the committed history, like CI. The hook above
      # only sees staged changes, which are empty at push time.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (git history)
        entry: gitleaks git --redact --no-banner .
        stages: [manual]
